<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صندوق دبوس البسطة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
--bg:#F2F6F4;
--surface:#FFFFFF;
--surface-alt:#EAF0EC;
--ink:#17241F;
--ink-soft:#5B6B64;
--line:#DCE4E0;
--teal:#0E6B5C;
--teal-dark:#0A4A40;
--teal-tint:#E3F3EE;
--coral:#C6483C;
--amber:#B8801C;
--radius:14px;
--shadow:0 1px 2px rgba(23,36,31,.06),0 6px 18px rgba(23,36,31,.06);
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--ink);
font-family:'Tajawal',sans-serif;
-webkit-font-smoothing:antialiased;
padding-bottom:40px;
}

.num{
font-family:'IBM Plex Mono',monospace;
unicode-bidi:plaintext;
}

.app-header{
position:sticky;
top:0;
z-index:20;
background:var(--teal-dark);
color:#fff;
padding:16px 18px 14px;
box-shadow:0 4px 14px rgba(10,74,64,.25);
}

.app-header h1{
margin:0;
font-size:1.15rem;
font-weight:900;
}

.app-header p{
margin:4px 0 0;
font-size:.82rem;
color:#CFE9E1;
font-weight:500;
}

nav.tabs{
position:sticky;
top:64px;
z-index:19;
display:flex;
gap:6px;
padding:10px 12px;
background:var(--bg);
border-bottom:1px solid var(--line);
overflow-x:auto;
}

nav.tabs button{
flex:0 0 auto;
border:1px solid var(--line);
background:var(--surface);
color:var(--ink-soft);
font-family:inherit;
font-weight:700;
font-size:.88rem;
padding:9px 16px;
border-radius:999px;
cursor:pointer;
}

nav.tabs button.active{
background:var(--teal);
border-color:var(--teal);
color:#fff;
}

main{
padding:14px 12px 0;
max-width:900px;
margin:0 auto;
}

.panel{
display:none;
}

.panel.active{
display:block;
animation:fade .18s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(4px);
}
to{
opacity:1;
transform:none;
}
}

.section-title{
font-size:.95rem;
font-weight:900;
color:var(--teal-dark);
margin:18px 2px 10px;
display:flex;
align-items:center;
gap:8px;
}

.section-title::before{
content:"";
width:6px;
height:6px;
border-radius:50%;
background:var(--teal);
}

.kpi-row{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

@media(min-width:560px){
.kpi-row{
grid-template-columns:repeat(4,1fr);
}
}

.kpi-card{
background:var(--surface);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:14px 12px;
border-inline-start:4px solid var(--line);
}

.kpi-card .label{
font-size:.76rem;
color:var(--ink-soft);
font-weight:700;
}

.kpi-card .value{
font-size:1.25rem;
font-weight:700;
margin-top:6px;
}

.kpi-card.teal{
border-inline-start-color:var(--teal);
}

.kpi-card.teal .value{
color:var(--teal-dark);
}

.kpi-card.coral{
border-inline-start-color:var(--coral);
}

.kpi-card.coral .value{
color:var(--coral);
}

.kpi-card.amber{
border-inline-start-color:var(--amber);
}

.kpi-card.amber .value{
color:var(--amber);
}

.card-grid{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

@media(min-width:640px){
.card-grid{
grid-template-columns:repeat(2,1fr);
}
}

.ticket-card{
position:relative;
background:var(--surface);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:14px 16px 12px;
border-top:2px dashed var(--line);
}

.ticket-card::before,
.ticket-card::after{
content:"";
position:absolute;
top:-9px;
width:18px;
height:18px;
background:var(--bg);
border-radius:50%;
}

.ticket-card::before{
inset-inline-start:12px;
}

.ticket-card::after{
inset-inline-end:12px;
}

.t-title{
font-weight:900;
font-size:.95rem;
color:var(--ink);
margin-bottom:3px;
}

.t-sub{
font-size:.76rem;
color:var(--ink-soft);
margin-bottom:10px;
}

.metric-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.metric{
background:var(--surface-alt);
border-radius:10px;
padding:8px 6px;
text-align:center;
}

.metric .m-label{
font-size:.7rem;
color:var(--ink-soft);
font-weight:700;
}

.metric .m-value{
font-size:.92rem;
font-weight:700;
margin-top:3px;
}

.metric.pos .m-value{
color:var(--teal-dark);
}

.metric.neg .m-value{
color:var(--coral);
}

.metric-list{
display:flex;
flex-direction:column;
gap:6px;
}

.metric-list .row{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 4px;
border-bottom:1px dashed var(--line);
font-size:.85rem;
}

.metric-list .row:last-child{
border-bottom:none;
}

.metric-list .m-label{
color:var(--ink-soft);
font-weight:600;
}

.metric-list .m-value{
font-weight:700;
}

.metric-list .m-value.neg{
color:var(--coral);
}

.empty-note{
background:var(--surface);
border:1px dashed var(--line);
border-radius:var(--radius);
padding:22px;
text-align:center;
color:var(--ink-soft);
font-size:.88rem;
}

.chart-box{
background:var(--surface);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:14px;
margin-bottom:18px;
}

.chart-layout{
display:grid;
grid-template-columns:115px minmax(0,1fr);
gap:12px;
align-items:stretch;
direction:ltr;
}

.month-list{
display:flex;
flex-direction:column;
gap:6px;
direction:rtl;
max-height:360px;
overflow-y:auto;
}

.month-btn{
border:1px solid var(--line);
background:var(--surface-alt);
color:var(--ink-soft);
font-family:inherit;
font-weight:700;
font-size:.78rem;
padding:8px 5px;
border-radius:9px;
cursor:pointer;
white-space:nowrap;
}

.month-btn.active{
background:var(--teal);
border-color:var(--teal);
color:#fff;
}

.chart-content{
min-width:0;
direction:rtl;
}

.chart-tabs{
display:flex;
gap:6px;
margin-bottom:12px;
overflow-x:auto;
}

.chart-tab{
border:1px solid var(--line);
background:var(--surface-alt);
color:var(--ink-soft);
font-family:inherit;
font-size:.78rem;
font-weight:700;
padding:8px 13px;
border-radius:999px;
cursor:pointer;
white-space:nowrap;
}

.chart-tab.active{
background:var(--teal);
border-color:var(--teal);
color:#fff;
}

.chart-title{
font-weight:900;
font-size:.92rem;
color:var(--teal-dark);
margin-bottom:8px;
}

.chart-canvas-wrap{
position:relative;
height:300px;
width:100%;
}

.chart-empty{
display:flex;
align-items:center;
justify-content:center;
height:300px;
color:var(--ink-soft);
font-size:.85rem;
text-align:center;
}

.filters-card{
background:var(--surface);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:14px;
display:flex;
flex-wrap:wrap;
gap:10px;
align-items:flex-end;
}

.field{
display:flex;
flex-direction:column;
gap:5px;
flex:1 1 140px;
min-width:130px;
}

.field label{
font-size:.76rem;
color:var(--ink-soft);
font-weight:700;
}

.field input,
.field select{
padding:10px;
border:1px solid var(--line);
border-radius:10px;
font-family:inherit;
font-size:.9rem;
background:var(--surface-alt);
color:var(--ink);
}

.btn-primary{
padding:11px 18px;
border:none;
border-radius:10px;
background:var(--teal);
color:#fff;
font-family:inherit;
font-weight:700;
font-size:.9rem;
cursor:pointer;
}

.sticky-total{
position:sticky;
top:112px;
z-index:15;
margin:12px 0;
padding:12px 16px;
border-radius:var(--radius);
background:var(--teal-tint);
border:1px solid var(--teal);
display:flex;
justify-content:space-between;
align-items:center;
}

.sticky-total .label{
font-weight:700;
color:var(--teal-dark);
font-size:.88rem;
}

.sticky-total .amount{
font-size:1.15rem;
font-weight:700;
color:var(--teal-dark);
}

.txn-list{
display:flex;
flex-direction:column;
gap:8px;
}

.txn-row{
display:flex;
align-items:center;
gap:10px;
background:var(--surface);
border-radius:12px;
box-shadow:var(--shadow);
padding:10px 12px;
border-inline-start:4px solid var(--line);
}

.txn-row.pos{
border-inline-start-color:var(--teal);
}

.txn-row.neg{
border-inline-start-color:var(--coral);
}

.txn-main{
flex:1;
min-width:0;
}

.txn-desc{
font-weight:700;
font-size:.9rem;
overflow-wrap:anywhere;
}

.txn-date{
font-size:.74rem;
color:var(--ink-soft);
margin-top:2px;
}

.txn-amount{
font-weight:700;
font-size:.95rem;
white-space:nowrap;
}

.txn-row.pos .txn-amount{
color:var(--teal-dark);
}

.txn-row.neg .txn-amount{
color:var(--coral);
}

@media(max-width:560px){
.chart-layout{
grid-template-columns:88px minmax(0,1fr);
gap:8px;
}

.chart-canvas-wrap,
.chart-empty{
height:260px;
}

.month-btn{
font-size:.7rem;
padding:7px 3px;
}
}
</style>
</head>

<body>

<header class="app-header">
<h1>صندوق دبوس البسطة</h1>
<p>سجل المبيعات والمصاريف اليومي</p>
</header>

<nav class="tabs">
<button class="tab-btn active" data-tab="overview">نظرة عامة</button>
<button class="tab-btn" data-tab="days">الأيام</button>
<button class="tab-btn" data-tab="txns">الحركات التفصيلية</button>
</nav>

<main>

<section class="panel active" id="panel-overview">

<div class="section-title">الإجمالي العام</div>
<div class="kpi-row" id="heroKpis"></div>

<div class="section-title">الملخص الشهري</div>
<div class="card-grid" id="monthlyCards"></div>

<div class="section-title">الرسم الأسبوعي حسب الشهر</div>

<div class="chart-box">
<div class="chart-layout">

<div class="month-list" id="weeklyMonthList"></div>

<div class="chart-content">

<div class="chart-tabs">
<button class="chart-tab active" data-chart="sell">المبيع</button>
<button class="chart-tab" data-chart="wholesale">الجملة</button>
<button class="chart-tab" data-chart="expenses">المصاريف</button>
</div>

<div class="chart-title" id="weeklyChartTitle"></div>

<div class="chart-canvas-wrap">
<canvas id="weeklyChart"></canvas>

<div class="chart-empty" id="weeklyChartEmpty" style="display:none;">
لا توجد بيانات لهذا الشهر
</div>
</div>

</div>
</div>
</div>

<div class="section-title">الملخص الأسبوعي (اثنين - أحد)</div>
<div class="card-grid" id="weeklyCards"></div>

</section>

<section class="panel" id="panel-days">

<div class="section-title">الرسم اليومي حسب الشهر</div>

<div class="chart-box">
<div class="chart-layout">

<div class="month-list" id="dailyMonthList"></div>

<div class="chart-content">

<div class="chart-tabs">
<button class="chart-tab active" data-chart="sell">سعر المبيع</button>
<button class="chart-tab" data-chart="wholesale">الجملة</button>
<button class="chart-tab" data-chart="expenses">المصاريف</button>
</div>

<div class="chart-title" id="dailyChartTitle"></div>

<div class="chart-canvas-wrap">
<canvas id="dailyChart"></canvas>

<div class="chart-empty" id="dailyChartEmpty" style="display:none;">
لا توجد بيانات لهذا الشهر
</div>
</div>

</div>
</div>
</div>

<div class="section-title">ملخص كل يوم</div>
<div class="card-grid" id="dailyCards"></div>

</section>

<section class="panel" id="panel-txns">

<div class="section-title">فلترة البيانات</div>

<div class="filters-card">

<div class="field">
<label>التاريخ</label>
<select id="selectDate">
<option value="">الكل</option>
</select>
</div>

<div class="field">
<label>العملية</label>
<select id="selectOperation">
<option value="">الكل</option>
</select>
</div>

<div class="field">
<label>بحث في البيان</label>
<input type="text" id="filterDescription" placeholder="مثال: شحن">
</div>

<div class="field">
<label>فلتر السعر</label>
<input type="text" id="filterAmount" placeholder="مثال: >=500">
</div>

<button class="btn-primary" id="btnShow">إظهار</button>

</div>

<div class="sticky-total">
<span class="label">إجمالي المبيع $</span>
<span class="amount num" id="totalAmount">0.00</span>
</div>

<div class="section-title">الحركات</div>
<div class="txn-list" id="transactionCards"></div>

</section>

</main>

<script>
const JSON_FILE_NAME = "data.json";

let weeklyChartInstance = null;
let dailyChartInstance = null;

let weeklyChartData = [];
let dailyChartData = [];

let selectedWeeklyMonth = "";
let selectedDailyMonth = "";

let weeklyChartType = "sell";
let dailyChartType = "sell";

const monthNamesAr = [
"كانون الثاني",
"شباط",
"آذار",
"نيسان",
"أيار",
"حزيران",
"تموز",
"آب",
"أيلول",
"تشرين الأول",
"تشرين الثاني",
"كانون الأول"
];

function formatNumber(value){
return new Intl.NumberFormat("en-US",{
minimumFractionDigits:2,
maximumFractionDigits:2
}).format(Number(value) || 0);
}

function formatNumberNoDecimals(value){
return new Intl.NumberFormat("en-US",{
minimumFractionDigits:0,
maximumFractionDigits:0
}).format(Number(value) || 0);
}

function numberValue(value){
const number = parseFloat(
String(value ?? "").replace(/,/g,"")
);

return isNaN(number) ? 0 : number;
}

function excelSerialToDate(serial){
const d = new Date(1899,11,30);
d.setDate(d.getDate() + Number(serial));
return d;
}

function formatArabicDate(d){
const daysAr = [
"الأحد",
"الاثنين",
"الثلاثاء",
"الأربعاء",
"الخميس",
"الجمعة",
"السبت"
];

return `${daysAr[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${d.getFullYear()}`;
}

function dateKeyLocal(d){
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function getMonthKey(date){
return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`;
}

function getMonthLabel(monthKey){
const parts = monthKey.split("-");
const year = parts[0];
const monthIndex = parseInt(parts[1],10) - 1;

return `${monthNamesAr[monthIndex]} ${year}`;
}

function getAvailableMonths(rows){
const months = new Set();

rows.forEach(row => {
if(row.date){
months.add(getMonthKey(row.date));
}
});

return Array.from(months).sort().reverse();
}

/*
====================================================
قراءة JSON وتحويله إلى Workbook داخلي
====================================================
*/
async function loadWorkbook(){

try{

const response = await fetch(
JSON_FILE_NAME + "?v=" + Date.now()
);

if(!response.ok){
throw new Error(
"لم يتم العثور على ملف data.json"
);
}

const jsonData = await response.json();

if(
!jsonData.sheets ||
typeof jsonData.sheets !== "object"
){
throw new Error(
"تنسيق ملف JSON غير صحيح"
);
}

const workbook = {
SheetNames:Object.keys(jsonData.sheets),
Sheets:{}
};

workbook.SheetNames.forEach(sheetName => {

const rows = jsonData.sheets[sheetName];

workbook.Sheets[sheetName] =
XLSX.utils.aoa_to_sheet(
Array.isArray(rows) ? rows : []
);
});

console.log(
"تم تحميل البيانات من data.json",
workbook.SheetNames
);

return workbook;

}catch(error){

console.error(error);

alert(
"خطأ في قراءة ملف data.json:\n" +
error.message
);

return null;
}
}

/*
====================================================
قراءة ورقة ملخص
====================================================
*/
function getRowsFromSummary(workbook){

const ws = workbook.Sheets["ملخص"];

if(!ws) return [];

const data = XLSX.utils.sheet_to_json(ws,{
header:1,
defval:"",
blankrows:false
});

const rows = [];

for(let r=2;r<data.length;r++){

const row = data[r];
const rawDate = row[0];

if(!rawDate) continue;

let dateObj = null;

if(typeof rawDate === "number"){
dateObj = excelSerialToDate(rawDate);
}else if(rawDate instanceof Date){
dateObj = new Date(rawDate);
}else{
const parsed = new Date(String(rawDate));

if(!isNaN(parsed.getTime())){
dateObj = parsed;
}
}

if(!dateObj || isNaN(dateObj.getTime())){
continue;
}

rows.push({
date:dateObj,
sell:numberValue(row[1]),
expenses:numberValue(row[2]),
wholesale:numberValue(row[3])
});
}

return rows;
}

/*
====================================================
الإجمالي العام
====================================================
*/
function renderHeroKpis(workbook){

const container = document.getElementById("heroKpis");
container.innerHTML = "";

const rows = getRowsFromSummary(workbook);

if(!rows.length){
container.innerHTML =
'<div class="empty-note">لا توجد بيانات في ورقة ملخص.</div>';
return;
}

let sell = 0;
let expenses = 0;
let wholesale = 0;

rows.forEach(row => {
sell += row.sell;
expenses += row.expenses;
wholesale += row.wholesale;
});

const cards = [
["مجموع البيع",sell,"teal"],
["مجموع المصاريف",expenses,"coral"],
["مجموع الجملة",wholesale,"amber"],
["عدد الأيام المسجلة",rows.length,"ink"]
];

cards.forEach(card => {

const div = document.createElement("div");

div.className = "kpi-card " + card[2];

div.innerHTML = `
<div class="label">${card[0]}</div>
<div class="value num">
${formatNumberNoDecimals(card[1])}
</div>
`;

container.appendChild(div);
});
}

/*
====================================================
الملخص الشهري
====================================================
*/
function renderMonthlyCards(workbook){

const container = document.getElementById("monthlyCards");
container.innerHTML = "";

const ws = workbook.Sheets["شهري"];

if(!ws){
container.innerHTML =
'<div class="empty-note">لا توجد ورقة باسم شهري.</div>';
return;
}

const data = XLSX.utils.sheet_to_json(ws,{
header:1,
defval:"",
blankrows:false
});

if(data.length < 2){
container.innerHTML =
'<div class="empty-note">لا توجد بيانات شهرية.</div>';
return;
}

const headers = data[0];
let hasData = false;

for(let r=1;r<data.length;r++){

const row = data[r];

if(row.every(value => value === "" || value == null)){
continue;
}

let hasNonZero = false;

for(let c=1;c<row.length;c++){
if(numberValue(row[c]) !== 0){
hasNonZero = true;
break;
}
}

if(!hasNonZero) continue;

hasData = true;

const card = document.createElement("div");
card.className = "ticket-card";

let html = "";

for(let c=1;c<row.length;c++){

if(row[c] === "" || row[c] == null){
continue;
}

const raw = row[c];
const numeric = numberValue(raw);
const isNumeric =
!isNaN(parseFloat(String(raw).replace(/,/g,"")));

html += `
<div class="row">
<span class="m-label">${headers[c] || ""}</span>
<span class="m-value num ${numeric < 0 ? "neg" : ""}">
${isNumeric ? formatNumberNoDecimals(numeric) : raw}
</span>
</div>
`;
}

card.innerHTML = `
<div class="t-title">${row[0] || ""}</div>
<div class="metric-list">${html}</div>
`;

container.appendChild(card);
}

if(!hasData){
container.innerHTML =
'<div class="empty-note">لا توجد بيانات شهرية.</div>';
}
}

/*
====================================================
حساب الأسابيع
====================================================
*/
function getWeekStartMonday(date){

const result = new Date(date);
const day = result.getDay();
const difference = day === 0 ? -6 : 1 - day;

result.setDate(result.getDate() + difference);
result.setHours(0,0,0,0);

return result;
}

function getWeekEndSunday(monday){

const result = new Date(monday);

result.setDate(result.getDate() + 6);

function buildWeeklyChartData(rows){

const map = new Map();

rows.forEach(row => {

const monday = getWeekStartMonday(row.date);
const sunday = getWeekEndSunday(monday);
const key = dateKeyLocal(monday);

if(!map.has(key)){
map.set(key,{
key:key,
from:monday,
to:sunday,
sell:0,
expenses:0,
wholesale:0
});
}

const week = map.get(key);

week.sell += row.sell;
week.expenses += row.expenses;
week.wholesale += row.wholesale;
});

return Array.from(map.values())
.filter(week =>
week.sell !== 0 ||
week.expenses !== 0 ||
week.wholesale !== 0
)
.sort((a,b) => a.to - b.to);
}

function getWeekNumberInsideMonth(
week,
monthKey,
allWeeks
){

const weeks = allWeeks
.filter(item => getMonthKey(item.to) === monthKey)
.sort((a,b) => a.to - b.to);

return weeks.findIndex(
item => item.key === week.key
) + 1;
}

/*

الفلاتر والحركات
====================================================
*/
function isDateSheetName(sheetName){
return /^\d{2}-\d{2}$/.test(sheetName.trim());
}

function getValidSheets(workbook){
return workbook.SheetNames.filter(isDateSheetName);
}

function getOperationList(workbook){

const operations = new Set();

getValidSheets(workbook).forEach(sheetName => {

const ws = workbook.Sheets[sheetName];

const rows = XLSX.utils.sheet_to_json(ws,{
header:1,
defval:"",
blankrows:false
});

rows.forEach(row => {

const operation = row[7];

if(
operation &&
typeof operation === "string" &&
operation.trim() !== ""
){
operations.add(operation.trim());
}
});
});

return Array.from(operations).sort();
}

function parseNumericFilter(input){

const text = String(input || "").trim();

if(!text) return null;

const cleaned = text.replace(/,/g,"");

let match = cleaned.match(/^>=\s*(-?\d+(?:\.\d+)?)$/);

if(match){
return {
type:"gte",
value:parseFloat(match[1])
};
}

match = cleaned.match(/^<=\s*(-?\d+(?:\.\d+)?)$/);

if(match){
return {
type:"lte",
value:parseFloat(match[1])
};
}

match = cleaned.match(/^>\s*(-?\d+(?:\.\d+)?)$/);

if(match){
return {
type:"gt",
value:parseFloat(match[1])
};
}

match = cleaned.match(/^<\s*(-?\d+(?:\.\d+)?)$/);

if(match){
return {
type:"lt",
value:parseFloat(match[1])
};
}

match = cleaned.match(
/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/
);

if(match){
return {
type:"range",
min:parseFloat(match[1]),
max:parseFloat(match[2])
};
}

const number = parseFloat(cleaned);

if(!isNaN(number)){
return {
type:"exact",
value:number
};
}

return {
type:"text",
value:cleaned
};
}

function matchesNumericFilter(amount,text){

if(!text) return true;

const filter = parseNumericFilter(text);

if(!filter) return true;

if(filter.type === "text"){
return formatNumber(amount).includes(filter.value) ||
String(amount).includes(filter.value);
}

if(filter.type === "exact"){
return Math.abs(amount - filter.value) < 0.000001;
}

if(filter.type === "gte"){
return amount >= filter.value;
}

if(filter.type === "lte"){
return amount <= filter.value;
}

if(filter.type === "gt"){
return amount > filter.value;
}

if(filter.type === "lt"){
return amount < filter.value;
}

if(filter.type === "range"){

const min = Math.min(filter.min,filter.max);
const max = Math.max(filter.min,filter.max);

return amount >= min && amount <= max;
}

return true;
}

function getFilteredRows(
workbook,
sheetName,
operation,
descriptionFilter,
amountFilter
){

const ws = workbook.Sheets[sheetName];

if(!ws) return [];

const data = XLSX.utils.sheet_to_json(ws,{
header:1,
defval:"",
blankrows:false
});

const rows = [];
const dateObj = sheetNameToDate(sheetName);
const dateText = sheetNameToFullDate(sheetName);

data.forEach(row => {

const operationValue = row[7];
const description = String(row[8] || "").trim();
const amount = numberValue(row[11]);

if(description === "حركة الصندوق") return;
if(amount === 0) return;

if(operation && operationValue !== operation){
return;
}

if(
descriptionFilter &&
!description.includes(descriptionFilter)
){
return;
}

if(!matchesNumericFilter(amount,amountFilter)){
return;
}

rows.push({
date:dateText,
dateObj:dateObj,
desc:description,
amount:amount
});
});

return rows;
}

);

function setupTransactionFilters(workbook){

const selectDate = document.getElementById("selectDate");
const selectOperation = document.getElementById("selectOperation");
const descriptionInput = document.getElementById("filterDescription");
const amountInput = document.getElementById("filterAmount");
const button = document.getElementById("btnShow");

const sheets = getValidSheets(workbook);

selectDate.innerHTML =
'<option value="">الكل</option>';

sheets.forEach(sheetName => {

const option = document.createElement("option");

option.value = sheetName;
option.textContent = sheetName;

selectDate.appendChild(option);
});

selectOperation.innerHTML =
'<option value="">الكل</option>';

getOperationList(workbook).forEach(operation => {

const option = document.createElement("option");

option.value = operation;
option.textContent = operation;

selectOperation.appendChild(option);
});

function runFilter(){

const selectedDate = selectDate.value;
const selectedOperation = selectOperation.value;
const description = descriptionInput.value.trim();
const amount = amountInput.value.trim();

const targetSheets = selectedDate
? [selectedDate]
: sheets;

let rows = [];

targetSheets.forEach(sheetName => {

rows = rows.concat(
getFilteredRows(
workbook,
sheetName,
selectedOperation,
description,
amount
)
);
});

renderTransactionCards(rows);
}

button.addEventListener("click",runFilter);
selectDate.addEventListener("change",runFilter);
selectOperation.addEventListener("change",runFilter);
descriptionInput.addEventListener("input",runFilter);
amountInput.addEventListener("input",runFilter);

runFilter();
}
