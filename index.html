<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مبيعات دبوس البسطة</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      padding: 0;
      background-color: #f7f7f7;
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      body {
        font-size: 1.1rem;
      }
    }

    .summary-box {
      margin: 10px 0 15px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      overflow-x: auto;
    }

    .summary-box h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      color: #333;
      text-align: center;
    }

    .monthly-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 900px;
      font-size: 0.95rem;
    }

    .monthly-table th,
    .monthly-table td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: center;
      white-space: nowrap;
    }

    .monthly-table th {
      background: #007cba;
      color: #fff;
    }

    .monthly-table td.negative-bold {
      color: #ff0000;
      font-weight: bold;
    }

    .summary-scroll {
      max-height: 260px;
      overflow-y: auto;
      overflow-x: auto;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .summary-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 450px;
      font-size: 0.95rem;
    }

    .summary-table th,
    .summary-table td {
      border: 1px solid #ccc;
      padding: 4px 6px;
      text-align: right;
      white-space: nowrap;
    }

    .summary-table th {
      background-color: #007cba;
      color: #fff;
      font-size: 0.9rem;
    }

    .summary-table tbody tr:nth-child(odd) {
      background-color: #fff8cc;
    }

    .summary-table tbody tr:nth-child(even) {
      background-color: #dff5d8;
    }

    .summary-table td.negative-bold {
      color: #ff0000;
      font-weight: bold;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 15px;
      padding: 8px 0;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #ddd;
    }

    .controls label {
      white-space: nowrap;
    }

    .controls input,
    .controls select {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      min-width: 120px;
    }

    @media (max-width: 480px) {
      .controls input,
      .controls select {
        min-width: 100px;
        font-size: 0.95rem;
      }
    }

    .controls button {
      padding: 9px 14px;
      font-size: 1rem;
      background-color: #007cba;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .controls button:hover {
      background-color: #005a87;
    }

    .summary {
      margin: 10px 0;
      padding: 10px 12px;
      background-color: #e0f7fa;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      font-size: 1.15rem;
      border: 1px solid #bbeeff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    #tableContainer {
      margin-top: 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
      font-size: 1rem;
    }

    @media (max-width: 480px) {
      table {
        min-width: 500px;
        font-size: 0.95rem;
      }
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      text-align: right;
      white-space: nowrap;
    }

    th {
      background-color: #007cba;
      color: white;
    }

    tbody tr:nth-child(odd) {
      background-color: #fff8cc;
    }

    tbody tr:nth-child(even) {
      background-color: #dff5d8;
    }

    tbody tr.row-positive,
    tbody tr.row-positive td {
      color: #003399 !important;
      font-weight: bold;
    }

    tbody tr.row-negative,
    tbody tr.row-negative td {
      color: #ff0000 !important;
      font-weight: bold;
    }

    label {
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <!-- الملخص الشهري -->
  <div class="summary-box">
    <h3>الملخص الشهري</h3>
    <table class="monthly-table" id="monthlyTable">
      <tbody id="monthlyBody"></tbody>
    </table>
  </div>

  <!-- الملخص الأسبوعي الجديد -->
  <div class="summary-box">
    <h3>الملخص الأسبوعي (من الاثنين إلى الأحد)</h3>
    <div class="summary-scroll">
      <table class="summary-table">
        <thead>
          <tr>
            <th>من تاريخ</th>
            <th>إلى تاريخ</th>
            <th>مجموع بيع</th>
            <th>مجموع مصاريف</th>
            <th>مجموع جملة</th>
          </tr>
        </thead>
        <tbody id="weeklyBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ملخص الأيام من ورقة ملخص -->
  <div class="summary-box">
    <h3>ملخص الأيام (من ورقة ملخص)</h3>
    <div class="summary-scroll">
      <table class="summary-table">
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>بيع</th>
            <th>مصاريف</th>
            <th>جملة</th>
          </tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
    </div>
  </div>

  <!-- القسم الرابع: الفلاتر + إجمالي المبيع + الجدول -->
  <div class="summary-box" style="height: 400px; display: flex; flex-direction: column;">
    <h3>البيانات التفصيلية</h3>
    
    <!-- الفلاتر -->
    <div class="controls">
      <div>
        <label>التاريخ:</label>
        <select id="selectDate">
          <option value="">الكل</option>
        </select>
      </div>
      <div>
        <label>العملية:</label>
        <select id="selectOperation">
          <option value="">الكل</option>
        </select>
      </div>
      <div>
        <label>فلتر البيان:</label>
        <input type="text" id="filterDescription" placeholder="بحث في البيانات" />
      </div>
      <div>
        <label>فلتر السعر:</label>
        <input type="text" id="filterAmount" placeholder="مثال: 1000 أو >= 500" />
      </div>
      <button id="btnShow">إظهار البيانات</button>
    </div>

    <!-- إجمالي المبيع -->
    <div class="summary">
      <span>إجمالي المبيع $: </span>
      <span id="totalAmount">0,000.00</span>
    </div>

    <!-- الجدول مع شريط التمرير -->
    <div class="summary-scroll" style="flex: 1; overflow-y: auto; min-height: 0;">
      <table id="dataTable">
        <thead>
          <tr>
            <th>التاريخ</th>
            <th>البيان</th>
            <th>المبيع $</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const EXCEL_FILE_NAME = "صندوق دبوس.xlsx";

    function formatNumber(value) {
      return new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(value);
    }

    function formatNumberNoDecimals(value) {
      return new Intl.NumberFormat('en-US', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(value);
    }

    // تحويل رقم تاريخ Excel إلى Date
    function excelSerialToDate(serial) {
      const d = new Date(1899, 11, 30);
      d.setDate(d.getDate() + serial);
      return d;
    }

    // تنسيق عربي مع اسم اليوم
    function formatArabicDate(d) {
      const daysAr = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
      const dayName = daysAr[d.getDay()];
      const day = String(d.getDate()).padStart(2, "0");
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const year = d.getFullYear();
      return `${dayName} ${day}-${month}-${year}`;
    }

    function parseNumericFilter(input) {
      const text = String(input || "").trim();
      if (!text) return null;

      const cleaned = text.replace(/,/g, "");

      let m = cleaned.match(/^>=\s*(-?\d+(?:\.\d+)?)$/);
      if (m) return { type: "gte", value: parseFloat(m[1]) };

      m = cleaned.match(/^<=\s*(-?\d+(?:\.\d+)?)$/);
      if (m) return { type: "lte", value: parseFloat(m[1]) };

      m = cleaned.match(/^>\s*(-?\d+(?:\.\d+)?)$/);
      if (m) return { type: "gt", value: parseFloat(m[1]) };

      m = cleaned.match(/^<\s*(-?\d+(?:\.\d+)?)$/);
      if (m) return { type: "lt", value: parseFloat(m[1]) };

      m = cleaned.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/);
      if (m) return { type: "range", min: parseFloat(m[1]), max: parseFloat(m[2]) };

      const num = parseFloat(cleaned);
      if (!isNaN(num)) return { type: "exact", value: num };

      return { type: "text", value: cleaned };
    }

    function matchesNumericFilter(amount, filterText) {
      if (!filterText) return true;

      const filter = parseNumericFilter(filterText);
      if (!filter) return true;

      if (filter.type === "text") {
        return formatNumber(amount).includes(filter.value) || String(amount).includes(filter.value);
      }

      if (filter.type === "exact") {
        return Math.abs(amount - filter.value) < 0.000001;
      }

      if (filter.type === "gte") return amount >= filter.value;
      if (filter.type === "lte") return amount <= filter.value;
      if (filter.type === "gt") return amount > filter.value;
      if (filter.type === "lt") return amount < filter.value;
      if (filter.type === "range") {
        const min = Math.min(filter.min, filter.max);
        const max = Math.max(filter.min, filter.max);
        return amount >= min && amount <= max;
      }

      return true;
    }

    async function loadWorkbook() {
      try {
        const response = await fetch(EXCEL_FILE_NAME);
        const data = await response.arrayBuffer();
        return XLSX.read(data, { type: "array" });
      } catch (e) {
        alert("خطأ في قراءة ملف صندوق دبوس.xlsx:\n" + e.message);
        console.error(e);
        return null;
      }
    }

    function sheetNameToFullDate(sheetName) {
      const m = sheetName.trim().match(/^(\d{2})-(\d{2})$/);
      if (!m) return sheetName;

      const day = parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const year = 2026; // عدّلها إذا تغيرت السنة

      const date = new Date(year, month - 1, day);
      return formatArabicDate(date);
    }

    function isDateSheetName(sheetName) {
      return /^\d{2}-\d{2}$/.test(sheetName.trim());
    }

    function getValidSheets(workbook) {
      return workbook.SheetNames.filter(isDateSheetName);
    }

    function getOperationList(workbook) {
      const ops = new Set();
      const sheets = workbook.SheetNames.filter(isDateSheetName);

      sheets.forEach(sheetName => {
        const ws = workbook.Sheets[sheetName];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", blankrows: false });

        for (let i = 0; i < data.length; i++) {
          const row = data[i];
          const op = row[7];
          if (op && typeof op === "string" && op.trim() !== "") {
            ops.add(op.trim());
          }
        }
      });

      return Array.from(ops).sort();
    }

    function getFilteredRows(workbook, sheetName, operation, descriptionFilter, amountFilter) {
      const ws = workbook.Sheets[sheetName];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });

      const rows = [];
      const dateStr = sheetNameToFullDate(sheetName);

      for (let i = 0; i < data.length; i++) {
        const row = data[i];
        const op = row[7];
        const desc = String(row[8] || "").trim();
        const amount = parseFloat(String(row[11] || "").replace(/,/g, ""));

        if (desc === "حركة الصندوق") continue;
        if (isNaN(amount) || amount === 0) continue;

        if (!operation || op === operation) {
          if (descriptionFilter && !desc.includes(descriptionFilter)) continue;
          if (!matchesNumericFilter(amount, amountFilter)) continue;

          rows.push({
            date: dateStr,
            desc: desc,
            amount: amount
          });
        }
      }

      return rows;
    }

    function renderTable(rows) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (rows.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="3">لا توجد بيانات مطابقة للبحث.</td>';
        tbody.appendChild(tr);
        document.getElementById("totalAmount").textContent = formatNumber(0);
        return;
      }

      let total = 0;
      rows.forEach(row => {
        const tr = document.createElement("tr");
        const rowClass = row.amount > 0 ? "row-positive" : "row-negative";
        tr.className = rowClass;
        tr.innerHTML = `
          <td>${row.date}</td>
          <td>${row.desc}</td>
          <td>${formatNumber(row.amount)}</td>
        `;
        tbody.appendChild(tr);
        total += row.amount;
      });

      document.getElementById("totalAmount").textContent = formatNumber(total);
    }

    function renderMonthlySummary(workbook) {
      const ws = workbook.Sheets["شهري"];
      const tbody = document.getElementById("monthlyBody");
      tbody.innerHTML = "";

      if (!ws) {
        tbody.innerHTML = '<tr><td>لا توجد ورقة باسم "شهري".</td></tr>';
        return;
      }

      const data = XLSX.utils.sheet_to_json(ws, {
        header: 1,
        defval: "",
        blankrows: false,
        range: "A1:K6"
      });

      data.forEach((row, rowIndex) => {
        const tr = document.createElement("tr");
        row.forEach((cell, colIndex) => {
          const td = document.createElement(rowIndex === 0 ? "th" : "td");
          let value = cell;

          if (colIndex > 0 && rowIndex > 0 && value !== "" && value != null) {
            const num = parseFloat(String(value).replace(/,/g, ""));
            if (!isNaN(num)) {
              value = formatNumberNoDecimals(num);
              td.textContent = value;
              if (num < 0) td.classList.add("negative-bold");
            } else {
              td.textContent = value;
            }
          } else {
            td.textContent = value;
          }

          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function renderSummarySheet(workbook) {
      const ws = workbook.Sheets["ملخص"];
      const tbody = document.getElementById("summaryBody");
      tbody.innerHTML = "";

      if (!ws) {
        tbody.innerHTML = '<tr><td colspan="4">لا توجد ورقة باسم "ملخص".</td></tr>';
        return;
      }

      const data = XLSX.utils.sheet_to_json(ws, {
        header: 1,
        defval: "",
        blankrows: false
      });

      for (let r = 2; r < data.length; r++) {
        const row = data[r];
        const rawDate = row[0];
        const rawSell = row[1];
        const rawExpenses = row[2];
        const rawWholesale = row[3];

        if (!rawDate && !rawSell && !rawExpenses && !rawWholesale) continue;

        let dateText;
        if (typeof rawDate === "number") {
          const d = excelSerialToDate(rawDate);
          dateText = formatArabicDate(d);
        } else if (rawDate instanceof Date) {
          dateText = formatArabicDate(rawDate);
        } else {
          dateText = String(rawDate);
        }

        const sellNum = parseFloat(String(rawSell).replace(/,/g, "")) || 0;
        const expensesNum = parseFloat(String(rawExpenses).replace(/,/g, "")) || 0;
        const wholesaleNum = parseFloat(String(rawWholesale).replace(/,/g, "")) || 0;

        const tr = document.createElement("tr");

        const tdDate = document.createElement("td");
        tdDate.textContent = dateText;
        tr.appendChild(tdDate);

        const tdSell = document.createElement("td");
        tdSell.textContent = formatNumberNoDecimals(sellNum);
        if (sellNum < 0) tdSell.classList.add("negative-bold");
        tr.appendChild(tdSell);

        const tdExpenses = document.createElement("td");
        tdExpenses.textContent = formatNumberNoDecimals(expensesNum);
        if (expensesNum < 0) tdExpenses.classList.add("negative-bold");
        tr.appendChild(tdExpenses);

        const tdWholesale = document.createElement("td");
        tdWholesale.textContent = formatNumberNoDecimals(wholesaleNum);
        if (wholesaleNum < 0) tdWholesale.classList.add("negative-bold");
        tr.appendChild(tdWholesale);

        tbody.appendChild(tr);
      }

      if (!tbody.children.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="4">لا توجد بيانات في ورقة الملخص.</td>';
        tbody.appendChild(tr);
      }
    }

    // الملخص الأسبوعي من ورقة ملخص
    function renderWeeklySummary(workbook) {
      const ws = workbook.Sheets["ملخص"];
      const tbody = document.getElementById("weeklyBody");
      tbody.innerHTML = "";

      if (!ws) {
        tbody.innerHTML = '<tr><td colspan="5">لا توجد ورقة باسم "ملخص".</td></tr>';
        return;
      }

      const data = XLSX.utils.sheet_to_json(ws, {
        header: 1,
        defval: "",
        blankrows: false
      });

      const rows = [];
      for (let r = 2; r < data.length; r++) {
        const row = data[r];
        const rawDate = row[0];

        if (!rawDate) continue;

        let d;
        if (typeof rawDate === "number") {
          d = excelSerialToDate(rawDate);
        } else if (rawDate instanceof Date) {
          d = rawDate;
        } else {
          const tryDate = new Date(String(rawDate));
          if (isNaN(tryDate.getTime())) continue;
          d = tryDate;
        }

        const sellNum = parseFloat(String(row[1]).replace(/,/g, "")) || 0;
        const expensesNum = parseFloat(String(row[2]).replace(/,/g, "")) || 0;
        const wholesaleNum = parseFloat(String(row[3]).replace(/,/g, "")) || 0;

        rows.push({
          date: d,
          sell: sellNum,
          expenses: expensesNum,
          wholesale: wholesaleNum
        });
      }

      if (!rows.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="5">لا توجد بيانات أسبوعية (ملخص فارغ).</td>';
        tbody.appendChild(tr);
        return;
      }

      rows.sort((a, b) => a.date - b.date);

      const weeklyMap = new Map();

      rows.forEach(r => {
        const d = new Date(r.date);
        const currentDay = d.getDay(); // 0 الأحد .. 1 الاثنين .. 6 السبت
        const diffToMonday = (currentDay === 0) ? -6 : (1 - currentDay);
        const monday = new Date(d);
        monday.setDate(d.getDate() + diffToMonday);

        const mondayKey = monday.toISOString().slice(0,10);

        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);

        let week = weeklyMap.get(mondayKey);
        if (!week) {
          week = {
            from: new Date(monday),
            to: new Date(sunday),
            sell: 0,
            expenses: 0,
            wholesale: 0
          };
          weeklyMap.set(mondayKey, week);
        }

        week.sell += r.sell;
        week.expenses += r.expenses;
        week.wholesale += r.wholesale;
      });

      const weeks = Array.from(weeklyMap.values()).sort((a, b) => a.from - b.from);

      weeks.forEach(w => {
        const tr = document.createElement("tr");

        const tdFrom = document.createElement("td");
        tdFrom.textContent = formatArabicDate(w.from);
        tr.appendChild(tdFrom);

        const tdTo = document.createElement("td");
        tdTo.textContent = formatArabicDate(w.to);
        tr.appendChild(tdTo);

        const tdSell = document.createElement("td");
        tdSell.textContent = formatNumberNoDecimals(w.sell);
        if (w.sell < 0) tdSell.classList.add("negative-bold");
        tr.appendChild(tdSell);

        const tdExpenses = document.createElement("td");
        tdExpenses.textContent = formatNumberNoDecimals(w.expenses);
        if (w.expenses < 0) tdExpenses.classList.add("negative-bold");
        tr.appendChild(tdExpenses);

        const tdWholesale = document.createElement("td");
        tdWholesale.textContent = formatNumberNoDecimals(w.wholesale);
        if (w.wholesale < 0) tdWholesale.classList.add("negative-bold");
        tr.appendChild(tdWholesale);

        tbody.appendChild(tr);
      });

      if (!tbody.children.length) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="5">لا توجد بيانات أسبوعية بعد التجميع.</td>';
        tbody.appendChild(tr);
      }
    }

    async function refreshPage() {
      const workbook = await loadWorkbook();
      if (!workbook) return;

      renderMonthlySummary(workbook);
      renderWeeklySummary(workbook);
      renderSummarySheet(workbook);

      const selectDate = document.getElementById("selectDate");
      const selectOperation = document.getElementById("selectOperation");
      const filterDescription = document.getElementById("filterDescription");
      const filterAmount = document.getElementById("filterAmount");

      const validSheets = getValidSheets(workbook);
      selectDate.innerHTML = '<option value="">الكل</option>';
      validSheets.forEach(sheet => {
        const opt = document.createElement("option");
        opt.value = sheet;
        opt.textContent = sheet;
        selectDate.appendChild(opt);
      });

      const operations = getOperationList(workbook);
      selectOperation.innerHTML = '<option value="">الكل</option>';
      operations.forEach(op => {
        const opt = document.createElement("option");
        opt.value = op;
        opt.textContent = op;
        selectOperation.appendChild(opt);
      });

      const btnShow = document.getElementById("btnShow");
      const runFilter = () => {
        const selectedDate = selectDate.value;
        const selectedOperation = selectOperation.value;
        const descFilter = filterDescription.value.trim();
        const amountFilter = filterAmount.value.trim();

        let allRows = [];
        let targetSheets = validSheets;

        if (selectedDate) targetSheets = [selectedDate];

        targetSheets.forEach(sheet => {
          const rowsInSheet = getFilteredRows(
            workbook,
            sheet,
            selectedOperation,
            descFilter,
            amountFilter
          );
          allRows = allRows.concat(rowsInSheet);
        });

        renderTable(allRows);
      };

      btnShow.onclick = runFilter;
      filterDescription.oninput = runFilter;
      filterAmount.oninput = runFilter;
      selectDate.onchange = runFilter;
      selectOperation.onchange = runFilter;

      runFilter();
    }

    window.addEventListener("load", refreshPage);
  </script>
</body>
</html>
