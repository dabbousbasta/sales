<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صندوق دبوس البسطة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- مكتبة XLSX تُستخدم فقط لزر "تصدير Excel" -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#F2F6F4;--surface:#FFF;--surface-alt:#EAF0EC;--ink:#17241F;--ink-soft:#5B6B64;--line:#DCE4E0;--teal:#0E6B5C;--teal-dark:#0A4A40;--teal-tint:#E3F3EE;--coral:#C6483C;--coral-tint:#FBEAE8;--amber:#B8801C;--amber-tint:#FBF1DD;--radius:14px;--shadow:0 1px 2px rgba(23,36,31,.06),0 6px 18px rgba(23,36,31,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:40px}
.num{font-family:'IBM Plex Mono',monospace;unicode-bidi:plaintext}
#refreshBtn{position:fixed;top:10px;left:10px;z-index:1000;border:none;border-radius:999px;padding:9px 15px;background:#198754;color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.22);display:inline-flex;align-items:center;gap:6px;transition:.15s ease}
#refreshBtn:hover:not(:disabled){background:#146c43;transform:translateY(-1px)}
#refreshBtn:disabled{opacity:.65;cursor:not-allowed}
#refreshBtn.loading .refresh-icon{animation:spin .8s linear infinite}
#refreshBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
header.app-header{position:sticky;top:0;z-index:20;background:var(--teal-dark);color:#fff;padding:16px 18px 14px;box-shadow:0 4px 14px rgba(10,74,64,.25)}
header.app-header h1{margin:0;font-size:1.15rem;font-weight:900;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
header.app-header p{margin:4px 0 0;font-size:.82rem;color:#CFE9E1;font-weight:500}
.update-badge{font-size:.66rem;font-weight:500;color:#CFE9E1;background:rgba(255,255,255,.1);padding:3px 9px;border-radius:999px;white-space:nowrap}
#bannerStack{position:sticky;top:64px;z-index:21;display:flex;flex-direction:column;gap:6px;padding:0 12px}
.app-banner{max-width:900px;margin:8px auto 0;padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow);animation:fade .18s ease}
.app-banner.error{background:var(--coral-tint);color:#7A2A22;border:1px solid var(--coral)}
.app-banner.success{background:var(--teal-tint);color:var(--teal-dark);border:1px solid var(--teal)}
.app-banner.info{background:var(--amber-tint);color:#6B4E12;border:1px solid var(--amber)}
.app-banner button{border:none;background:transparent;font-size:1rem;line-height:1;cursor:pointer;color:inherit;padding:2px 4px}
nav.tabs{position:sticky;top:64px;z-index:19;display:flex;gap:6px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:.88rem;padding:9px 16px;border-radius:999px;cursor:pointer}
nav.tabs button.active{background:var(--teal);border-color:var(--teal);color:#fff}
nav.tabs button:focus-visible{outline:2px solid var(--teal-dark);outline-offset:2px}
main{padding:14px 12px 0;max-width:900px;margin:0 auto}
.panel{display:none}
.panel.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-title{font-size:.95rem;font-weight:900;color:var(--teal-dark);margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal)}
.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
.kpi-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 12px;border-inline-start:4px solid var(--line)}
.kpi-card .label{font-size:.76rem;color:var(--ink-soft);font-weight:700}
.kpi-card .value{font-size:1.25rem;font-weight:700;margin-top:6px}
.kpi-card.teal{border-inline-start-color:var(--teal)}.kpi-card.teal .value{color:var(--teal-dark)}
.kpi-card.coral{border-inline-start-color:var(--coral)}.kpi-card.coral .value{color:var(--coral)}
.kpi-card.amber{border-inline-start-color:var(--amber)}.kpi-card.amber .value{color:var(--amber)}
.kpi-card.ink .value{color:var(--ink)}
.period-info{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:10px 14px;margin-top:10px;font-size:.82rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:14px}
.period-info strong{color:var(--ink);font-weight:700}
.card-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.card-grid{grid-template-columns:repeat(2,1fr)}}
.ticket-card{position:relative;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 12px;border-top:2px dashed var(--line)}
.ticket-card.high-expense{border-top-color:var(--coral);background:linear-gradient(180deg,var(--coral-tint) 0%,var(--surface) 22%)}
.ticket-card::before,.ticket-card::after{content:"";position:absolute;top:-9px;width:18px;height:18px;background:var(--bg);border-radius:50%}
.ticket-card::before{inset-inline-start:12px}.ticket-card::after{inset-inline-end:12px}
.ticket-card .t-title{font-weight:900;font-size:.95rem;color:var(--ink);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-flag{font-size:.66rem;font-weight:700;color:var(--coral);background:var(--coral-tint);border:1px solid var(--coral);border-radius:999px;padding:2px 8px}
.ticket-card .t-sub{font-size:.76rem;color:var(--ink-soft);margin-bottom:10px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:var(--surface-alt);border-radius:10px;padding:8px 6px;text-align:center}
.metric .m-label{font-size:.7rem;color:var(--ink-soft);font-weight:700}
.metric .m-value{font-size:.92rem;font-weight:700;margin-top:3px}
.metric.neg .m-value{color:var(--coral)}.metric.pos .m-value{color:var(--teal-dark)}
.metric-list{display:flex;flex-direction:column;gap:6px}
.metric-list .row{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px dashed var(--line);font-size:.85rem}
.metric-list .row:last-child{border-bottom:none}
.metric-list .m-label{color:var(--ink-soft);font-weight:600}
.metric-list .m-value{font-weight:700}
.metric-list .m-value.neg{color:var(--coral)}
.empty-note{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--ink-soft);font-size:.88rem}
.list-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.list-toolbar input{flex:1 1 200px;min-width:150px;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:16px;background:var(--surface-alt);color:var(--ink)}
.btn-secondary{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:.84rem;cursor:pointer;white-space:nowrap}
.btn-secondary:hover{background:var(--surface-alt);color:var(--ink)}
.load-more-wrap{display:flex;justify-content:center;margin:16px 0}
.filters-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 140px;min-width:130px}
.field label{font-size:.76rem;color:var(--ink-soft);font-weight:700}
.field input,.field select{padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:16px;background:var(--surface-alt);color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:1px}
.field .field-error{font-size:.72rem;color:var(--coral);font-weight:700;min-height:14px}
.filters-actions{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-end}
.btn-primary{padding:11px 18px;border:none;border-radius:10px;background:var(--teal);color:#fff;font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer}
.btn-primary:hover{background:var(--teal-dark)}
.btn-primary:focus-visible,.btn-secondary:focus-visible{outline:2px solid var(--teal-dark);outline-offset:2px}
.sticky-total{position:sticky;top:112px;z-index:15;margin:12px 0;padding:12px 16px;border-radius:var(--radius);background:var(--teal-tint);border:1px solid var(--teal);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.sticky-total .label-group{display:flex;flex-direction:column;gap:2px}
.sticky-total .label{font-weight:700;color:var(--teal-dark);font-size:.88rem}
.sticky-total .count-note{font-size:.72rem;color:var(--ink-soft)}
.sticky-total .amount{font-size:1.15rem;font-weight:700;color:var(--teal-dark)}
.actions-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.txn-list{display:flex;flex-direction:column;gap:8px}
.txn-row{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;border-inline-start:4px solid var(--line)}
.txn-row.pos{border-inline-start-color:var(--teal)}.txn-row.neg{border-inline-start-color:var(--coral)}
.txn-main{flex:1;min-width:0}
.txn-desc{font-weight:700;font-size:.9rem;color:var(--ink);overflow-wrap:anywhere}
.txn-date{font-size:.74rem;color:var(--ink-soft);margin-top:2px}
.txn-amount{font-weight:700;font-size:.95rem;white-space:nowrap}
.txn-row.pos .txn-amount{color:var(--teal-dark)}.txn-row.neg .txn-amount{color:var(--coral)}
@media(max-width:560px){#refreshBtn{top:8px;left:8px;padding:7px 11px;font-size:.78rem}nav.tabs,#bannerStack{top:60px}.sticky-total{top:108px}}
@media print{#refreshBtn,nav.tabs,#bannerStack,.filters-card,.actions-row,.load-more-wrap,.list-toolbar{display:none!important}header.app-header{position:static;box-shadow:none}.sticky-total{position:static}body{background:#fff}}
</style>
</head>
<body>

<button id="refreshBtn" type="button" disabled>
  <span class="refresh-icon" aria-hidden="true">🔄</span>
  <span class="refresh-text">تحديث</span>
</button>

<header class="app-header">
  <h1>صندوق دبوس البسطة <span class="update-badge" id="lastUpdateBadge"></span></h1>
  <p>سجل المبيعات والمصاريف اليومي</p>
</header>

<div id="bannerStack" aria-live="polite"></div>

<nav class="tabs" role="tablist" aria-label="أقسام الصفحة">
  <button class="tab-btn active" data-tab="overview" role="tab" id="tabbtn-overview" aria-selected="true" aria-controls="panel-overview" tabindex="0">نظرة عامة</button>
  <button class="tab-btn" data-tab="days" role="tab" id="tabbtn-days" aria-selected="false" aria-controls="panel-days" tabindex="-1">الأيام</button>
  <button class="tab-btn" data-tab="txns" role="tab" id="tabbtn-txns" aria-selected="false" aria-controls="panel-txns" tabindex="-1">الحركات التفصيلية</button>
</nav>

<main>
<section class="panel active" id="panel-overview" role="tabpanel" aria-labelledby="tabbtn-overview" tabindex="0">
  <div class="section-title">الإجمالي العام</div>
  <div class="kpi-row" id="heroKpis"></div>
  <div class="period-info" id="periodInfo"></div>
  <div class="section-title">الملخص الشهري</div>
  <div class="card-grid" id="monthlyCards"></div>
  <div class="section-title">الملخص الأسبوعي (اثنين - أحد)</div>
  <div class="card-grid" id="weeklyCards"></div>
</section>

<section class="panel" id="panel-days" role="tabpanel" aria-labelledby="tabbtn-days" tabindex="0">
  <div class="section-title">ملخص كل يوم</div>
  <div class="list-toolbar">
    <input type="text" id="daySearchInput" placeholder="بحث عن يوم معيّن (مثال: 15-03 أو الأحد)" aria-label="بحث في الأيام">
    <button class="btn-secondary" id="clearDaySearchBtn" type="button">مسح البحث</button>
  </div>
  <div id="daysResultNote" style="margin:0 2px 10px;font-size:.78rem;color:var(--ink-soft)"></div>
  <div class="card-grid" id="dailyCards"></div>
  <div class="load-more-wrap" id="daysLoadMoreWrap" hidden>
    <button class="btn-secondary" id="loadMoreDaysBtn" type="button">عرض المزيد من الأيام</button>
  </div>
</section>

<section class="panel" id="panel-txns" role="tabpanel" aria-labelledby="tabbtn-txns" tabindex="0">
  <div class="section-title">فلترة البيانات</div>
  <div class="filters-card">
    <div class="field"><label for="selectDate">التاريخ</label><select id="selectDate"><option value="">الكل</option></select></div>
    <div class="field"><label for="selectOperation">العملية</label><select id="selectOperation"><option value="">الكل</option></select></div>
    <div class="field"><label for="filterDescription">بحث في البيان</label><input type="text" id="filterDescription" placeholder="مثال: شراء مواد تنظيف"></div>
    <div class="field"><label for="filterAmount">فلتر السعر</label><input type="text" id="filterAmount" placeholder="مثال: >=500 أو 500-1000" aria-describedby="filterAmountError"><span class="field-error" id="filterAmountError"></span></div>
    <div class="filters-actions">
      <button class="btn-primary" id="btnShow" type="button">إظهار</button>
      <button class="btn-secondary" id="clearFiltersBtn" type="button">مسح الفلاتر</button>
    </div>
  </div>
  <div class="sticky-total">
    <div class="label-group"><span class="label">إجمالي المبيع $</span><span class="count-note" id="resultCountNote" aria-live="polite"></span></div>
    <span class="amount num" id="totalAmount">0.00</span>
  </div>
  <div class="actions-row">
    <button class="btn-secondary" id="copyResultsBtn" type="button">نسخ النتائج</button>
    <button class="btn-secondary" id="printResultsBtn" type="button">طباعة</button>
    <button class="btn-secondary" id="exportExcelBtn" type="button">تصدير Excel</button>
  </div>
  <div class="section-title">الحركات</div>
  <div class="txn-list" id="transactionCards"></div>
  <div class="load-more-wrap" id="txnLoadMoreWrap" hidden>
    <button class="btn-secondary" id="loadMoreTxnBtn" type="button">عرض المزيد من الحركات</button>
  </div>
</section>
</main>

<script>
/* ========== الإعدادات والحالة ========== */
const DATA_BASE = "data/";           // مجلد ملفات JSON
const CACHE_KEY_FILTERS = "sanduq_dabbous_last_filters";
const PAGE_SIZE_TXN = 150;
const PAGE_SIZE_DAYS = 20;

let appIndex = null;                 // محتوى data/index.json
let summaryRows = [];                // صفوف ورقة "ملخص" (التواريخ كـ Date)
const dayFileCache = new Map();      // "التاريخ|الإصدار" -> حركات اليوم
let transactionIndex = [];
let currentMatchedRows = [];
let allDailyRows = [];
let txnDisplayLimit = PAGE_SIZE_TXN;
let dailyDisplayLimit = PAGE_SIZE_DAYS;
let txnTabOpened = false;
let txnLoadToken = 0;
let tabsInitialized = false;

/* ========== أدوات عامة ========== */
function formatNumber(v){return new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)}
function formatNumberNoDecimals(v){return new Intl.NumberFormat("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}).format(Number(v)||0)}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function normalizeArabicText(t){
  return String(t??"").replace(/[\u064B-\u065F\u0670]/g,"").replace(/[إأآا]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").toLowerCase().trim();
}
function convertArabicDigits(t){return String(t??"").replace(/[٠-٩]/g,c=>String("٠١٢٣٤٥٦٧٨٩".indexOf(c)))}
function debounce(fn,ms){let t=null;return function(...a){if(t)clearTimeout(t);t=setTimeout(()=>fn.apply(this,a),ms)}}
function parseIso(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)}
function formatArabicDate(date){
  const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  return `${days[date.getDay()]} ${String(date.getDate()).padStart(2,"0")}-${String(date.getMonth()+1).padStart(2,"0")}-${date.getFullYear()}`;
}
function formatArabicDateTime(date){
  let h=date.getHours();const m=String(date.getMinutes()).padStart(2,"0");const p=h>=12?"م":"ص";
  h=h%12;if(h===0)h=12;
  return `${formatArabicDate(date)} - ${h}:${m} ${p}`;
}
function updateLastUpdateDisplay(iso){
  const badge=document.getElementById("lastUpdateBadge");
  const d=iso?new Date(iso):null;
  badge.textContent=(d&&!isNaN(d.getTime()))?"آخر تحديث: "+formatArabicDateTime(d):"";
}
function parseAmount(v){
  if(typeof v==="number")return v;
  const t=convertArabicDigits(String(v??"")).replace(/,/g,"").replace(/\$/g,"").trim();
  if(!t)return 0;
  const n=Number(t);return Number.isFinite(n)?n:0;
}

/* ========== فلتر المبلغ ========== */
function parseNumericFilter(raw){
  const text=convertArabicDigits(String(raw||"")).trim();
  if(!text)return null;
  const c=text.replace(/,/g,"").replace(/\s+/g,"");
  const N="(-?\\d+(?:\\.\\d+)?)";
  let m;
  if((m=c.match(new RegExp("^>="+N+"$"))))return{valid:true,type:"gte",value:Number(m[1])};
  if((m=c.match(new RegExp("^<="+N+"$"))))return{valid:true,type:"lte",value:Number(m[1])};
  if((m=c.match(new RegExp("^>"+N+"$"))))return{valid:true,type:"gt",value:Number(m[1])};
  if((m=c.match(new RegExp("^<"+N+"$"))))return{valid:true,type:"lt",value:Number(m[1])};
  if((m=c.match(new RegExp("^"+N+"-"+N+"$"))))return{valid:true,type:"range",min:Number(m[1]),max:Number(m[2])};
  const n=Number(c);
  if(Number.isFinite(n))return{valid:true,type:"exact",value:n};
  return{valid:false};
}
function matchesNumericFilter(a,f){
  if(!f||!f.valid)return true;
  switch(f.type){
    case"exact":return a===f.value;
    case"gte":return a>=f.value;
    case"lte":return a<=f.value;
    case"gt":return a>f.value;
    case"lt":return a<f.value;
    case"range":return a>=Math.min(f.min,f.max)&&a<=Math.max(f.min,f.max);
  }
  return true;
}

/* ========== الحركات (ملف JSON لكل يوم) ========== */
async function fetchDay(d){
  const key=d.date+"|"+d.v;
  if(dayFileCache.has(key))return dayFileCache.get(key);
  const res=await fetch(DATA_BASE+d.file+"?v="+d.v);
  if(!res.ok)throw new Error("تعذر تحميل يوم "+d.date);
  const data=await res.json();
  dayFileCache.set(key,data.transactions||[]);
  return dayFileCache.get(key);
}
async function loadDays(list,onProgress){
  let next=0,done=0;
  const worker=async()=>{
    while(next<list.length){
      const d=list[next++];
      await fetchDay(d);
      if(onProgress)onProgress(++done,list.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(8,list.length)},worker));
}
function buildTransactionIndex(){
  const out=[];
  appIndex.days.forEach(d=>{
    const tx=dayFileCache.get(d.date+"|"+d.v);
    if(!tx)return;
    const dateObj=parseIso(d.date),dateText=formatArabicDate(dateObj);
    tx.forEach(t=>out.push({
      sheetName:d.date,date:dateText,dateObj:dateObj,
      operation:t.op,description:t.desc,
      normalizedDescription:normalizeArabicText(t.desc),amount:t.amount
    }));
  });
  return out;
}
function computeMatchedRows(f){
  const terms=normalizeArabicText(f.description).split(/\s+/).filter(Boolean);
  const pf=parseNumericFilter(f.amount);
  const result=transactionIndex.filter(r=>{
    if(f.date&&r.sheetName!==f.date)return false;
    if(f.operation&&r.operation!==f.operation)return false;
    if(!terms.every(t=>r.normalizedDescription.includes(t)))return false;
    return matchesNumericFilter(r.amount,pf);
  });
  result.sort((a,b)=>b.dateObj-a.dateObj);
  return result;
}
function renderTransactionCards(){
  const container=document.getElementById("transactionCards");
  const wrap=document.getElementById("txnLoadMoreWrap");
  const note=document.getElementById("resultCountNote");
  container.innerHTML="";
  const total=currentMatchedRows.length;
  if(total===0){
    container.innerHTML='<div class="empty-note">لا توجد بيانات مطابقة للبحث.</div>';
    document.getElementById("totalAmount").textContent=formatNumber(0);
    note.textContent="0 نتيجة";wrap.hidden=true;return;
  }
  const show=currentMatchedRows.slice(0,txnDisplayLimit);
  let sum=0;currentMatchedRows.forEach(r=>sum+=r.amount);
  show.forEach(r=>{
    const el=document.createElement("div");
    el.className="txn-row "+(r.amount>0?"pos":"neg");
    el.innerHTML=`<div class="txn-main"><div class="txn-desc">${escapeHtml(r.description||"(بدون بيان)")}</div><div class="txn-date">${escapeHtml(r.date)}${r.operation?" · "+escapeHtml(r.operation):""}</div></div><div class="txn-amount num">${formatNumber(r.amount)}</div>`;
    container.appendChild(el);
  });
  document.getElementById("totalAmount").textContent=formatNumber(sum);
  if(show.length<total){
    note.textContent="عرض "+formatNumberNoDecimals(show.length)+" من أصل "+formatNumberNoDecimals(total)+" حركة";
    wrap.hidden=false;
  }else{
    note.textContent=formatNumberNoDecimals(total)+" حركة مطابقة";wrap.hidden=true;
  }
}

/* ========== النظرة العامة ========== */
function renderHeroKpis(){
  const container=document.getElementById("heroKpis");
  const info=document.getElementById("periodInfo");
  container.innerHTML="";info.innerHTML="";
  let sell=0,exp=0,whole=0,count=0,first=null,last=null;
  for(let i=2;i<summaryRows.length;i++){
    const r=summaryRows[i];
    if(!r[0]&&!r[1]&&!r[2]&&!r[3])continue;
    sell+=parseAmount(r[1]);exp+=parseAmount(r[2]);whole+=parseAmount(r[3]);count++;
    if(r[0] instanceof Date&&!isNaN(r[0].getTime())){
      if(!first||r[0]<first)first=r[0];
      if(!last||r[0]>last)last=r[0];
    }
  }
  [{l:"مجموع البيع",v:sell,c:"teal"},{l:"مجموع المصاريف",v:exp,c:"coral"},{l:"مجموع الجملة",v:whole,c:"amber"},{l:"عدد الأيام المسجلة",v:count,c:"ink"}].forEach(k=>{
    const el=document.createElement("div");
    el.className="kpi-card "+k.c;
    el.innerHTML=`<div class="label">${k.l}</div><div class="value num">${formatNumberNoDecimals(k.v)}</div>`;
    container.appendChild(el);
  });
  if(first&&last){
    info.innerHTML=`<span>الفترة المسجّلة: <strong>${escapeHtml(formatArabicDate(first))}</strong> إلى <strong>${escapeHtml(formatArabicDate(last))}</strong></span><span>آخر تاريخ في البيانات: <strong>${escapeHtml(formatArabicDate(last))}</strong></span>`;
  }
}
function renderMonthlyCards(){
  const container=document.getElementById("monthlyCards");
  container.innerHTML="";
  const rows=appIndex.monthly||[];
  if(rows.length<2){container.innerHTML='<div class="empty-note">لا توجد بيانات شهرية.</div>';return}
  const headers=rows[0];let has=false;
  for(let i=1;i<rows.length;i++){
    const row=rows[i];
    if(row.every(v=>v===""||v==null))continue;
    let nonZero=false;
    for(let c=1;c<row.length;c++){if(parseAmount(row[c])!==0){nonZero=true;break}}
    if(!nonZero)continue;
    has=true;
    let html="";
    for(let c=1;c<row.length;c++){
      if(row[c]===""||row[c]==null)continue;
      const n=parseAmount(row[c]);
      html+=`<div class="row"><span class="m-label">${escapeHtml(headers[c]||"")}</span><span class="m-value num ${n<0?"neg":""}">${formatNumberNoDecimals(n)}</span></div>`;
    }
    const card=document.createElement("div");
    card.className="ticket-card";
    card.innerHTML=`<div class="t-title">${escapeHtml(row[0]||"")}</div><div class="metric-list">${html}</div>`;
    container.appendChild(card);
  }
  if(!has)container.innerHTML='<div class="empty-note">لا توجد بيانات شهرية.</div>';
}
function renderWeeklyCards(){
  const container=document.getElementById("weeklyCards");
  container.innerHTML="";
  const map=new Map();
  for(let i=2;i<summaryRows.length;i++){
    const r=summaryRows[i];
    const date=r[0];
    if(!(date instanceof Date)||isNaN(date.getTime()))continue;
    const day=date.getDay();
    const monday=new Date(date);
    monday.setDate(date.getDate()+(day===0?-6:1-day));
    monday.setHours(0,0,0,0);
    const key=monday.getFullYear()+"-"+monday.getMonth()+"-"+monday.getDate();
    if(!map.has(key)){
      const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
      map.set(key,{from:monday,to:sunday,sell:0,expenses:0,wholesale:0});
    }
    const w=map.get(key);
    w.sell+=parseAmount(r[1]);w.expenses+=parseAmount(r[2]);w.wholesale+=parseAmount(r[3]);
  }
  const weeks=Array.from(map.values()).filter(w=>w.sell||w.expenses||w.wholesale).sort((a,b)=>b.from-a.from);
  if(!weeks.length){container.innerHTML='<div class="empty-note">لا توجد بيانات أسبوعية.</div>';return}
  weeks.forEach(w=>{
    const m=(l,v)=>`<div class="metric ${v<0?"neg":"pos"}"><div class="m-label">${l}</div><div class="m-value num">${formatNumberNoDecimals(v)}</div></div>`;
    const card=document.createElement("div");
    card.className="ticket-card";
    card.innerHTML=`<div class="t-title">أسبوع ${formatArabicDate(w.from)}</div><div class="t-sub">إلى ${formatArabicDate(w.to)}</div><div class="metric-grid">${m("بيع",w.sell)}${m("مصاريف",w.expenses)}${m("جملة",w.wholesale)}</div>`;
    container.appendChild(card);
  });
}

/* ========== الأيام ========== */
function buildDailyRows(){
  const out=[];
  for(let i=2;i<summaryRows.length;i++){
    const r=summaryRows[i];
    if(!r[0])continue;
    const isDate=r[0] instanceof Date&&!isNaN(r[0].getTime());
    const sell=parseAmount(r[1]),expenses=parseAmount(r[2]),wholesale=parseAmount(r[3]);
    if(sell===0&&expenses===0&&wholesale===0)continue;
    out.push({dateObj:isDate?r[0]:null,dateText:isDate?formatArabicDate(r[0]):String(r[0]),sell,expenses,wholesale});
  }
  out.sort((a,b)=>(b.dateObj?b.dateObj.getTime():0)-(a.dateObj?a.dateObj.getTime():0));
  if(out.length){
    const avg=out.reduce((s,r)=>s+Math.abs(r.expenses),0)/out.length;
    out.forEach(r=>{r.highExpense=avg>0&&Math.abs(r.expenses)>avg*1.5});
  }
  return out;
}
function renderDailyCards(){
  const container=document.getElementById("dailyCards");
  const wrap=document.getElementById("daysLoadMoreWrap");
  const note=document.getElementById("daysResultNote");
  container.innerHTML="";
  const q=normalizeArabicText(document.getElementById("daySearchInput").value);
  const rows=q?allDailyRows.filter(r=>normalizeArabicText(r.dateText).includes(q)):allDailyRows;
  if(!rows.length){
    container.innerHTML='<div class="empty-note">لا توجد بيانات يومية مطابقة.</div>';
    note.textContent="0 يوم";wrap.hidden=true;return;
  }
  const show=rows.slice(0,dailyDisplayLimit);
  show.forEach(r=>{
    const m=(l,v)=>`<div class="metric ${v<0?"neg":"pos"}"><div class="m-label">${l}</div><div class="m-value num">${formatNumberNoDecimals(v)}</div></div>`;
    const card=document.createElement("div");
    card.className="ticket-card"+(r.highExpense?" high-expense":"");
    card.innerHTML=`<div class="t-title">${escapeHtml(r.dateText)}${r.highExpense?'<span class="t-flag">مصاريف مرتفعة</span>':""}</div><div class="metric-grid">${m("بيع",r.sell)}${m("مصاريف",r.expenses)}${m("جملة",r.wholesale)}</div>`;
    container.appendChild(card);
  });
  if(show.length<rows.length){
    note.textContent="عرض "+formatNumberNoDecimals(show.length)+" من أصل "+formatNumberNoDecimals(rows.length)+" يوم";
    wrap.hidden=false;
  }else{
    note.textContent=formatNumberNoDecimals(rows.length)+" يوم";wrap.hidden=true;
  }
}

/* ========== التبويبات ========== */
function activateTab(name){
  document.querySelectorAll(".tab-btn").forEach(b=>{
    const on=b.dataset.tab===name;
    b.classList.toggle("active",on);
    b.setAttribute("aria-selected",on?"true":"false");
    b.tabIndex=on?0:-1;
  });
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  const panel=document.getElementById("panel-"+name);
  if(panel)panel.classList.add("active");
  /* الحركات تتحمّل فقط عند فتح هذا التبويب */
  if(name==="txns"&&!txnTabOpened){txnTabOpened=true;applyTransactionFilter()}
}
function setupTabs(){
  if(tabsInitialized)return;
  tabsInitialized=true;
  const buttons=Array.from(document.querySelectorAll(".tab-btn"));
  buttons.forEach((btn,i)=>{
    btn.addEventListener("click",()=>activateTab(btn.dataset.tab));
    btn.addEventListener("keydown",e=>{
      let t=null;
      if(e.key==="ArrowRight")t=(i+1)%buttons.length;
      else if(e.key==="ArrowLeft")t=(i-1+buttons.length)%buttons.length;
      else if(e.key==="Home")t=0;
      else if(e.key==="End")t=buttons.length-1;
      if(t!==null){e.preventDefault();buttons[t].focus();activateTab(buttons[t].dataset.tab)}
    });
  });
}

/* ========== الرسائل ========== */
function showBanner(message,type){
  const stack=document.getElementById("bannerStack");
  const b=document.createElement("div");
  b.className="app-banner "+type;
  b.setAttribute("role",type==="error"?"alert":"status");
  const s=document.createElement("span");s.textContent=message;
  const x=document.createElement("button");
  x.type="button";x.setAttribute("aria-label","إغلاق الرسالة");x.textContent="✕";
  x.onclick=()=>b.remove();
  b.appendChild(s);b.appendChild(x);stack.appendChild(b);
  if(type!=="error")setTimeout(()=>b.remove(),5000);
}

/* ========== الفلاتر ========== */
function getCurrentFilters(){
  return{
    date:document.getElementById("selectDate").value,
    operation:document.getElementById("selectOperation").value,
    description:document.getElementById("filterDescription").value,
    amount:document.getElementById("filterAmount").value
  };
}
function saveFiltersToStorage(f){try{localStorage.setItem(CACHE_KEY_FILTERS,JSON.stringify(f))}catch(e){}}
function loadFiltersFromStorage(){try{const r=localStorage.getItem(CACHE_KEY_FILTERS);return r?JSON.parse(r):null}catch(e){return null}}
function restoreSelectValue(select,value){
  select.value=Array.from(select.options).some(o=>o.value===value)?value:"";
}
function refreshFilters(){
  const selectDate=document.getElementById("selectDate");
  const selectOp=document.getElementById("selectOperation");
  let f=getCurrentFilters();
  if(!f.date&&!f.operation&&!f.description&&!f.amount){
    const saved=loadFiltersFromStorage();
    if(saved)f=saved;
  }
  selectDate.innerHTML='<option value="">الكل</option>';
  appIndex.days.forEach(d=>{
    const o=document.createElement("option");
    o.value=d.date;o.textContent=formatArabicDate(parseIso(d.date));
    selectDate.appendChild(o);
  });
  selectOp.innerHTML='<option value="">الكل</option>';
  (appIndex.operations||[]).forEach(op=>{
    const o=document.createElement("option");
    o.value=op;o.textContent=op;selectOp.appendChild(o);
  });
  restoreSelectValue(selectDate,f.date||"");
  restoreSelectValue(selectOp,f.operation||"");
  document.getElementById("filterDescription").value=f.description||"";
  document.getElementById("filterAmount").value=f.amount||"";
}
async function applyTransactionFilter(){
  if(!appIndex||!txnTabOpened)return;
  const token=++txnLoadToken;
  const f=getCurrentFilters();
  const pf=parseNumericFilter(f.amount);
  document.getElementById("filterAmountError").textContent=(pf&&!pf.valid)?"صيغة فلتر المبلغ غير صحيحة":"";
  const needed=f.date?appIndex.days.filter(d=>d.date===f.date):appIndex.days;
  const missing=needed.filter(d=>!dayFileCache.has(d.date+"|"+d.v));
  if(missing.length){
    const note=document.getElementById("resultCountNote");
    try{
      await loadDays(missing,(n,t)=>{if(token===txnLoadToken)note.textContent="جاري تحميل الحركات "+n+" / "+t});
    }catch(e){showBanner("تعذر تحميل بعض الحركات: "+e.message,"error")}
    if(token!==txnLoadToken)return;
  }
  transactionIndex=buildTransactionIndex();
  currentMatchedRows=computeMatchedRows(f);
  txnDisplayLimit=PAGE_SIZE_TXN;
  renderTransactionCards();
  saveFiltersToStorage(f);
}
function setupFilters(){
  document.getElementById("btnShow").onclick=applyTransactionFilter;
  document.getElementById("selectDate").onchange=applyTransactionFilter;
  document.getElementById("selectOperation").onchange=applyTransactionFilter;
  const desc=document.getElementById("filterDescription");
  desc.oninput=debounce(applyTransactionFilter,220);
  document.getElementById("filterAmount").oninput=debounce(applyTransactionFilter,220);
  desc.addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";applyTransactionFilter()}});
  document.getElementById("clearFiltersBtn").onclick=()=>{
    ["selectDate","selectOperation","filterDescription","filterAmount"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("filterAmountError").textContent="";
    applyTransactionFilter();
  };
  document.getElementById("loadMoreTxnBtn").onclick=()=>{txnDisplayLimit+=PAGE_SIZE_TXN;renderTransactionCards()};
  document.getElementById("loadMoreDaysBtn").onclick=()=>{dailyDisplayLimit+=PAGE_SIZE_DAYS;renderDailyCards()};
  const daySearch=document.getElementById("daySearchInput");
  daySearch.oninput=debounce(()=>{dailyDisplayLimit=PAGE_SIZE_DAYS;renderDailyCards()},220);
  daySearch.addEventListener("keydown",e=>{if(e.key==="Escape"){e.target.value="";dailyDisplayLimit=PAGE_SIZE_DAYS;renderDailyCards()}});
  document.getElementById("clearDaySearchBtn").onclick=()=>{daySearch.value="";dailyDisplayLimit=PAGE_SIZE_DAYS;renderDailyCards()};
  document.getElementById("copyResultsBtn").onclick=copyResultsToClipboard;
  document.getElementById("printResultsBtn").onclick=()=>window.print();
  document.getElementById("exportExcelBtn").onclick=exportResultsToExcel;
}
async function copyResultsToClipboard(){
  if(!currentMatchedRows.length){showBanner("لا توجد نتائج لنسخها.","info");return}
  const lines=currentMatchedRows.map(r=>`${r.date}\t${r.operation||"-"}\t${r.description||"-"}\t${formatNumber(r.amount)}`);
  try{
    await navigator.clipboard.writeText("التاريخ\tالعملية\tالبيان\tالمبلغ\n"+lines.join("\n"));
    showBanner("تم نسخ "+formatNumberNoDecimals(currentMatchedRows.length)+" نتيجة إلى الحافظة.","success");
  }catch(e){showBanner("تعذر النسخ إلى الحافظة في هذا المتصفح.","error")}
}
function exportResultsToExcel(){
  if(!currentMatchedRows.length){showBanner("لا توجد نتائج لتصديرها.","info");return}
  try{
    const data=currentMatchedRows.map(r=>({"التاريخ":r.date,"العملية":r.operation,"البيان":r.description,"المبلغ":r.amount}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"نتائج");
    XLSX.writeFile(wb,"نتائج_صندوق_دبوس.xlsx");
    showBanner("تم تصدير "+formatNumberNoDecimals(currentMatchedRows.length)+" نتيجة (كل النتائج المطابقة للفلاتر).","success");
  }catch(e){console.error(e);showBanner("تعذر تصدير الملف.","error")}
}

/* ========== التحميل والتحديث ========== */
function renderAll(){
  summaryRows=(appIndex.summary||[]).map((r,i)=>
    (i>=2&&/^\d{4}-\d{2}-\d{2}$/.test(String(r[0])))?[parseIso(r[0]),...r.slice(1)]:r
  );
  allDailyRows=buildDailyRows();
  renderHeroKpis();
  renderMonthlyCards();
  renderWeeklyCards();
  dailyDisplayLimit=PAGE_SIZE_DAYS;
  renderDailyCards();
  refreshFilters();
  applyTransactionFilter();
}
async function refreshPage(){
  const button=document.getElementById("refreshBtn");
  const icon=button.querySelector(".refresh-icon");
  const text=button.querySelector(".refresh-text");
  button.disabled=true;button.classList.add("loading");
  icon.textContent="⟳";text.textContent="جاري التحديث";
  try{
    let res;
    try{res=await fetch(DATA_BASE+"index.json?t="+Date.now(),{cache:"no-store"})}
    catch(e){throw new Error("تعذر الاتصال. تأكد من الإنترنت.")}
    if(!res.ok)throw new Error(res.status===404?"لم يتم العثور على data/index.json":"رمز الخطأ "+res.status);
    appIndex=await res.json();
    renderAll();
    updateLastUpdateDisplay(appIndex.updated);
    showBanner("تم تحديث البيانات بنجاح.","success");
  }catch(error){
    console.error(error);
    showBanner("تعذر تحديث البيانات: "+error.message+" — البيانات المعروضة هي آخر نسخة محمّلة.","error");
  }finally{
    button.disabled=false;button.classList.remove("loading");
    icon.textContent="🔄";text.textContent="تحديث";
  }
}

setupTabs();
setupFilters();
document.getElementById("refreshBtn").addEventListener("click",refreshPage);
window.addEventListener("load",refreshPage);
</script>
