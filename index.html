<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صندوق دبوس البسطة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
:root{
    --bg:#F2F6F4;
    --surface:#FFFFFF;
    --surface-alt:#EAF0EC;
    --ink:#17241F;
    --ink-soft:#5B6B64;
    --line:#DCE4E0;
    --teal:#0E6B5C;
    --teal-dark:#0A4A40;
    --teal-tint:#E3F3EE;
    --coral:#C6483C;
    --amber:#B8801C;
    --radius:14px;
    --shadow:0 1px 2px rgba(23,36,31,.06),
             0 6px 18px rgba(23,36,31,.06);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Tajawal',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
}

.num{
    font-family:'IBM Plex Mono',monospace;
    unicode-bidi:plaintext;
}

/* زر تحديث الصفحة */
#refreshBtn{
    position:fixed;
    top:10px;
    left:10px;
    z-index:1000;
    border:none;
    border-radius:999px;
    padding:9px 15px;
    background:#198754;
    color:#fff;
    font-family:inherit;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.22);
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:.15s ease;
}

#refreshBtn:hover:not(:disabled){
    background:#146c43;
    transform:translateY(-1px);
}

#refreshBtn:active:not(:disabled){
    transform:translateY(1px);
}

#refreshBtn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

#refreshBtn.loading .refresh-icon{
    animation:spin .8s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

/* الرأس */
header.app-header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--teal-dark);
    color:#fff;
    padding:16px 18px 14px;
    box-shadow:0 4px 14px rgba(10,74,64,.25);
}

header.app-header h1{
    margin:0;
    font-size:1.15rem;
    font-weight:900;
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
}

header.app-header p{
    margin:4px 0 0;
    font-size:.82rem;
    color:#CFE9E1;
    font-weight:500;
}

.update-badge{
    font-size:.66rem;
    font-weight:500;
    color:#CFE9E1;
    background:rgba(255,255,255,.1);
    padding:3px 9px;
    border-radius:999px;
    white-space:nowrap;
}

/* التبويبات */
nav.tabs{
    position:sticky;
    top:64px;
    z-index:19;
    display:flex;
    gap:6px;
    padding:10px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    overflow-x:auto;
}

nav.tabs button{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:inherit;
    font-weight:700;
    font-size:.88rem;
    padding:9px 16px;
    border-radius:999px;
    cursor:pointer;
}

nav.tabs button.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
}

main{
    padding:14px 12px 0;
    max-width:900px;
    margin:0 auto;
}

.panel{
    display:none;
}

.panel.active{
    display:block;
    animation:fade .18s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(4px);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.section-title{
    font-size:.95rem;
    font-weight:900;
    color:var(--teal-dark);
    margin:18px 2px 10px;
    display:flex;
    align-items:center;
    gap:8px;
}

.section-title::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--teal);
}

/* بطاقات الإجمالي */
.kpi-row{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

@media(min-width:560px){
    .kpi-row{
        grid-template-columns:repeat(4,1fr);
    }
}

.kpi-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 12px;
    border-inline-start:4px solid var(--line);
}

.kpi-card .label{
    font-size:.76rem;
    color:var(--ink-soft);
    font-weight:700;
}

.kpi-card .value{
    font-size:1.25rem;
    font-weight:700;
    margin-top:6px;
}

.kpi-card.teal{
    border-inline-start-color:var(--teal);
}

.kpi-card.teal .value{
    color:var(--teal-dark);
}

.kpi-card.coral{
    border-inline-start-color:var(--coral);
}

.kpi-card.coral .value{
    color:var(--coral);
}

.kpi-card.amber{
    border-inline-start-color:var(--amber);
}

.kpi-card.amber .value{
    color:var(--amber);
}

.kpi-card.ink .value{
    color:var(--ink);
}

/* البطاقات العامة */
.card-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

@media(min-width:640px){
    .card-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

.ticket-card{
    position:relative;
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px 16px 12px;
    border-top:2px dashed var(--line);
}

.ticket-card::before,
.ticket-card::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px;
    height:18px;
    background:var(--bg);
    border-radius:50%;
}

.ticket-card::before{
    inset-inline-start:12px;
}

.ticket-card::after{
    inset-inline-end:12px;
}

.ticket-card .t-title{
    font-weight:900;
    font-size:.95rem;
    color:var(--ink);
    margin-bottom:2px;
}

.ticket-card .t-sub{
    font-size:.76rem;
    color:var(--ink-soft);
    margin-bottom:10px;
}

.metric-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.metric{
    background:var(--surface-alt);
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
}

.metric .m-label{
    font-size:.7rem;
    color:var(--ink-soft);
    font-weight:700;
}

.metric .m-value{
    font-size:.92rem;
    font-weight:700;
    margin-top:3px;
}

.metric.neg .m-value{
    color:var(--coral);
}

.metric.pos .m-value{
    color:var(--teal-dark);
}

.metric-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.metric-list .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 4px;
    border-bottom:1px dashed var(--line);
    font-size:.85rem;
}

.metric-list .row:last-child{
    border-bottom:none;
}

.metric-list .m-label{
    color:var(--ink-soft);
    font-weight:600;
}

.metric-list .m-value{
    font-weight:700;
}

.metric-list .m-value.neg{
    color:var(--coral);
}

.empty-note{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:22px;
    text-align:center;
    color:var(--ink-soft);
    font-size:.88rem;
}

/* الفلاتر */
.filters-card{
    background:var(--surface);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:flex-end;
}

.field{
    display:flex;
    flex-direction:column;
    gap:5px;
    flex:1 1 140px;
    min-width:130px;
}

.field label{
    font-size:.76rem;
    color:var(--ink-soft);
    font-weight:700;
}

.field input,
.field select{
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    font-family:inherit;
    font-size:.9rem;
    background:var(--surface-alt);
    color:var(--ink);
}

.field input:focus,
.field select:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
}

.btn-primary{
    padding:11px 18px;
    border:none;
    border-radius:10px;
    background:var(--teal);
    color:#fff;
    font-family:inherit;
    font-weight:700;
    font-size:.9rem;
    cursor:pointer;
}

.btn-primary:hover{
    background:var(--teal-dark);
}

/* الإجمالي المثبت */
.sticky-total{
    position:sticky;
    top:112px;
    z-index:15;
    margin:12px 0;
    padding:12px 16px;
    border-radius:var(--radius);
    background:var(--teal-tint);
    border:1px solid var(--teal);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sticky-total .label{
    font-weight:700;
    color:var(--teal-dark);
    font-size:.88rem;
}

.sticky-total .amount{
    font-size:1.15rem;
    font-weight:700;
    color:var(--teal-dark);
}

/* الحركات */
.txn-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.txn-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:10px 12px;
    border-inline-start:4px solid var(--line);
}

.txn-row.pos{
    border-inline-start-color:var(--teal);
}

.txn-row.neg{
    border-inline-start-color:var(--coral);
}

.txn-main{
    flex:1;
    min-width:0;
}

.txn-desc{
    font-weight:700;
    font-size:.9rem;
    color:var(--ink);
    overflow-wrap:anywhere;
}

.txn-date{
    font-size:.74rem;
    color:var(--ink-soft);
    margin-top:2px;
}

.txn-amount{
    font-weight:700;
    font-size:.95rem;
    white-space:nowrap;
}

.txn-row.pos .txn-amount{
    color:var(--teal-dark);
}

.txn-row.neg .txn-amount{
    color:var(--coral);
}

@media(max-width:560px){
    #refreshBtn{
        top:8px;
        left:8px;
        padding:7px 11px;
        font-size:.78rem;
    }
}
</style>
</head>

<body>

<button id="refreshBtn" type="button" disabled>
    <span class="refresh-icon">🔄</span>
    <span class="refresh-text">تحديث</span>
</button>

<header class="app-header">
    <h1>
        صندوق دبوس البسطة
        <span class="update-badge" id="lastUpdateBadge"></span>
    </h1>
    <p>سجل المبيعات والمصاريف اليومي</p>
</header>

<nav class="tabs">
    <button class="tab-btn active" data-tab="overview">
        نظرة عامة
    </button>

    <button class="tab-btn" data-tab="days">
        الأيام
    </button>

    <button class="tab-btn" data-tab="txns">
        الحركات التفصيلية
    </button>
</nav>

<main>

<section class="panel active" id="panel-overview">
    <div class="section-title">الإجمالي العام</div>
    <div class="kpi-row" id="heroKpis"></div>

    <div class="section-title">الملخص الشهري</div>
    <div class="card-grid" id="monthlyCards"></div>

    <div class="section-title">الملخص الأسبوعي (اثنين - أحد)</div>
    <div class="card-grid" id="weeklyCards"></div>
</section>

<section class="panel" id="panel-days">
    <div class="section-title">ملخص كل يوم</div>
    <div class="card-grid" id="dailyCards"></div>
</section>

<section class="panel" id="panel-txns">
    <div class="section-title">فلترة البيانات</div>

    <div class="filters-card">
        <div class="field">
            <label for="selectDate">التاريخ</label>
            <select id="selectDate">
                <option value="">الكل</option>
            </select>
        </div>

        <div class="field">
            <label for="selectOperation">العملية</label>
            <select id="selectOperation">
                <option value="">الكل</option>
            </select>
        </div>

        <div class="field">
            <label for="filterDescription">بحث في البيان</label>
            <input
                type="text"
                id="filterDescription"
                placeholder="مثال: شحن"
            >
        </div>

        <div class="field">
            <label for="filterAmount">فلتر السعر</label>
            <input
                type="text"
                id="filterAmount"
                placeholder="مثال: >=500"
            >
        </div>

        <button class="btn-primary" id="btnShow" type="button">
            إظهار
        </button>
    </div>

    <div class="sticky-total">
        <span class="label">إجمالي المبيع $</span>
        <span class="amount num" id="totalAmount">0.00</span>
    </div>

    <div class="section-title">الحركات</div>
    <div class="txn-list" id="transactionCards"></div>
</section>

</main>

<script>
const EXCEL_FILE_NAME = "صندوق دبوس.xlsx";

/*
    مفاتيح التخزين المحلي.
    نخزن نسخة من الملف (Base64) ووقت آخر تحديث،
    حتى تفتح الصفحة بسرعة من غير ما تنتظر التحميل.
*/
const CACHE_KEY_DATA = "sanduq_dabbous_cache_data";
const CACHE_KEY_TIME = "sanduq_dabbous_cache_time";

let tabsInitialized = false;
let currentWorkbook = null;

function formatNumber(value){
    return new Intl.NumberFormat("en-US", {
        minimumFractionDigits:2,
        maximumFractionDigits:2
    }).format(Number(value) || 0);
}

function formatNumberNoDecimals(value){
    return new Intl.NumberFormat("en-US", {
        minimumFractionDigits:0,
        maximumFractionDigits:0
    }).format(Number(value) || 0);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/*
    تحويل بيانات الملف (ArrayBuffer) إلى نص Base64
    حتى نقدر نخزنها بالـ localStorage.
*/
function arrayBufferToBase64(buffer){
    let binary = "";

    const bytes = new Uint8Array(buffer);
    const chunkSize = 0x8000;

    for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.subarray(i, i + chunkSize);

        binary += String.fromCharCode.apply(
            null,
            chunk
        );
    }

    return btoa(binary);
}

function base64ToArrayBuffer(base64){
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return bytes.buffer;
}

/*
    حفظ نسخة الملف ووقت التحديث محلياً.
*/
function saveToCache(arrayBuffer, isoTimestamp){
    try {
        const base64 = arrayBufferToBase64(arrayBuffer);

        localStorage.setItem(CACHE_KEY_DATA, base64);
        localStorage.setItem(CACHE_KEY_TIME, isoTimestamp);
    } catch (error) {
        console.error(
            "تعذر حفظ البيانات محلياً:",
            error
        );
    }
}

/*
    قراءة النسخة المحفوظة محلياً، إن وجدت.
*/
function loadFromCache(){
    const base64 = localStorage.getItem(CACHE_KEY_DATA);
    const timestamp = localStorage.getItem(CACHE_KEY_TIME);

    if (!base64) {
        return null;
    }

    try {
        return {
            arrayBuffer:base64ToArrayBuffer(base64),
            timestamp:timestamp
        };
    } catch (error) {
        console.error(
            "تعذر قراءة النسخة المحفوظة:",
            error
        );

        return null;
    }
}

function parseWorkbookFromBuffer(arrayBuffer){
    return XLSX.read(
        new Uint8Array(arrayBuffer),
        {
            type:"array",
            cellDates:true
        }
    );
}

function formatArabicDateTime(date){
    const dateText = formatArabicDate(date);

    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, "0");
    const period = hours >= 12 ? "م" : "ص";

    hours = hours % 12;

    if (hours === 0) {
        hours = 12;
    }

    return `${dateText} - ${hours}:${minutes} ${period}`;
}

function updateLastUpdateDisplay(isoTimestamp){
    const badge =
        document.getElementById("lastUpdateBadge");

    if (!badge) {
        return;
    }

    if (!isoTimestamp) {
        badge.textContent = "";
        return;
    }

    const date = new Date(isoTimestamp);

    if (isNaN(date.getTime())) {
        badge.textContent = "";
        return;
    }

    badge.textContent =
        "آخر تحديث: " +
        formatArabicDateTime(date);
}

function excelSerialToDate(serial){
    const date = new Date(1899, 11, 30);
    date.setDate(date.getDate() + Number(serial));
    return date;
}

function formatArabicDate(date){
    const days = [
        "الأحد",
        "الاثنين",
        "الثلاثاء",
        "الأربعاء",
        "الخميس",
        "الجمعة",
        "السبت"
    ];

    const dayName = days[date.getDay()];
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const year = date.getFullYear();

    return `${dayName} ${day}-${month}-${year}`;
}

function parseAmount(value){
    if (typeof value === "number") {
        return value;
    }

    const text = String(value ?? "")
        .replace(/,/g, "")
        .replace(/\$/g, "")
        .trim();

    if (!text) {
        return 0;
    }

    const number = Number(text);

    return Number.isFinite(number) ? number : 0;
}

function parseNumericFilter(value){
    const text = String(value || "").trim();

    if (!text) {
        return null;
    }

    const cleaned = text.replace(/,/g, "");

    let match = cleaned.match(/^>=\s*(-?\d+(?:\.\d+)?)$/);

    if (match) {
        return {
            type:"gte",
            value:Number(match[1])
        };
    }

    match = cleaned.match(/^<=\s*(-?\d+(?:\.\d+)?)$/);

    if (match) {
        return {
            type:"lte",
            value:Number(match[1])
        };
    }

    match = cleaned.match(/^>\s*(-?\d+(?:\.\d+)?)$/);

    if (match) {
        return {
            type:"gt",
            value:Number(match[1])
        };
    }

    match = cleaned.match(/^<\s*(-?\d+(?:\.\d+)?)$/);

    if (match) {
        return {
            type:"lt",
            value:Number(match[1])
        };
    }

    match = cleaned.match(
        /^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/
    );

    if (match) {
        return {
            type:"range",
            min:Number(match[1]),
            max:Number(match[2])
        };
    }

    const exactNumber = Number(cleaned);

    if (Number.isFinite(exactNumber)) {
        return {
            type:"exact",
            value:exactNumber
        };
    }

    return {
        type:"text",
        value:cleaned
    };
}

function matchesNumericFilter(amount, filterText){
    if (!filterText) {
        return true;
    }

    const filter = parseNumericFilter(filterText);

    if (!filter) {
        return true;
    }

    if (filter.type === "exact") {
        return amount === filter.value;
    }

    if (filter.type === "gte") {
        return amount >= filter.value;
    }

    if (filter.type === "lte") {
        return amount <= filter.value;
    }

    if (filter.type === "gt") {
        return amount > filter.value;
    }

    if (filter.type === "lt") {
        return amount < filter.value;
    }

    if (filter.type === "range") {
        const min = Math.min(filter.min, filter.max);
        const max = Math.max(filter.min, filter.max);

        return amount >= min && amount <= max;
    }

    if (filter.type === "text") {
        return String(amount).includes(filter.value);
    }

    return true;
}

/*
    تحميل ملف Excel من جديد.
    ?v=Date.now() و cache:no-store
    يساعدان في طلب النسخة الجديدة من الملف.
*/
async function loadWorkbook(){
    const separator =
        EXCEL_FILE_NAME.includes("?")
        ? "&"
        : "?";

    const freshUrl =
        EXCEL_FILE_NAME +
        separator +
        "v=" +
        Date.now();

    const response = await fetch(freshUrl, {
        cache:"no-store"
    });

    if (!response.ok) {
        throw new Error(
            "تعذر تحميل الملف. رمز الخطأ: " +
            response.status
        );
    }

    return await response.arrayBuffer();
}

function getDateFromSheetName(sheetName){
    const match =
        String(sheetName).trim().match(/^(\d{2})-(\d{2})$/);

    if (!match) {
        return null;
    }

    const day = Number(match[1]);
    const month = Number(match[2]);

    return new Date(2026, month - 1, day);
}

function formatSheetDate(sheetName){
    const date = getDateFromSheetName(sheetName);

    return date
        ? formatArabicDate(date)
        : String(sheetName);
}

function isDateSheetName(sheetName){
    return /^\d{2}-\d{2}$/.test(
        String(sheetName).trim()
    );
}

function getDateSheets(workbook){
    return workbook.SheetNames.filter(
        isDateSheetName
    );
}

/*
    قراءة قائمة العمليات من العمود H.
    رقم العمود H هو 7 لأن JavaScript يبدأ من صفر.
*/
function getOperationList(workbook){
    const operations = new Set();

    getDateSheets(workbook).forEach(sheetName => {
        const worksheet = workbook.Sheets[sheetName];

        const rows = XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

        rows.forEach(row => {
            const operation =
                String(row[7] ?? "").trim();

            if (operation) {
                operations.add(operation);
            }
        });
    });

    return Array.from(operations).sort(
        (a,b) => a.localeCompare(b, "ar")
    );
}

/*
    الدالة المصححة.

    operationFilter:
    العملية التي اختارها المستخدم.

    operation:
    العملية الموجودة داخل صف Excel.

    تم فصل الاسمين حتى لا يحدث تعارض.
*/
function getFilteredRows(
    workbook,
    sheetName,
    operationFilter,
    descriptionFilter,
    amountFilter
){
    const worksheet =
        workbook.Sheets[sheetName];

    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

    const result = [];

    const dateObj =
        getDateFromSheetName(sheetName);

    const dateText =
        formatSheetDate(sheetName);

    rows.forEach(row => {
        /*
            H = العملية
            I = البيان
            L = المبلغ
        */
        const operation =
            String(row[7] ?? "").trim();

        const description =
            String(row[8] ?? "").trim();

        const amount =
            parseAmount(row[11]);

        /*
            تجاهل سطر "حركة الصندوق" فقط.
            لا نتجاهل الأسطر بدون بيان بعد الآن،
            المعيار الوحيد هو أن يكون المبلغ غير صفر.
        */
        if (description === "حركة الصندوق") {
            return;
        }

        if (amount === 0) {
            return;
        }

        /*
            إذا اختار المستخدم عملية،
            نعرض العملية المطابقة فقط.
        */
        if (
            operationFilter &&
            operation !== operationFilter
        ) {
            return;
        }

        /*
            البحث داخل البيان.
            إذا كان البيان فارغاً ولم يبحث المستخدم
            عن نص معين، يبقى السطر ظاهراً.
        */
        if (
            descriptionFilter &&
            !description
                .toLowerCase()
                .includes(
                    descriptionFilter.toLowerCase()
                )
        ) {
            return;
        }

        /*
            فلترة المبلغ
        */
        if (
            !matchesNumericFilter(
                amount,
                amountFilter
            )
        ) {
            return;
        }

        result.push({
            date:dateText,
            dateObj:dateObj,
            operation:operation,
            description:description,
            amount:amount
        });
    });

    return result;
}

function renderTransactionCards(rows){
    const container =
        document.getElementById("transactionCards");

    container.innerHTML = "";

    if (rows.length === 0) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد بيانات مطابقة للبحث.' +
            '</div>';

        document.getElementById("totalAmount")
            .textContent = formatNumber(0);

        return;
    }

    rows.sort((a,b) => {
        const dateA = a.dateObj
            ? a.dateObj.getTime()
            : 0;

        const dateB = b.dateObj
            ? b.dateObj.getTime()
            : 0;

        return dateB - dateA;
    });

    let total = 0;

    rows.forEach(row => {
        const className =
            row.amount > 0
            ? "pos"
            : "neg";

        const element =
            document.createElement("div");

        element.className =
            "txn-row " + className;

        const descriptionText =
            row.description
            ? row.description
            : "(بدون بيان)";

        element.innerHTML = `
            <div class="txn-main">
                <div class="txn-desc">
                    ${escapeHtml(descriptionText)}
                </div>

                <div class="txn-date">
                    ${escapeHtml(row.date)}
                </div>
            </div>

            <div class="txn-amount num">
                ${formatNumber(row.amount)}
            </div>
        `;

        container.appendChild(element);

        total += row.amount;
    });

    document.getElementById("totalAmount")
        .textContent = formatNumber(total);
}

function renderHeroKpis(workbook){
    const worksheet =
        workbook.Sheets["ملخص"];

    const container =
        document.getElementById("heroKpis");

    container.innerHTML = "";

    if (!worksheet) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد ورقة باسم "ملخص".' +
            '</div>';

        return;
    }

    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

    let sellTotal = 0;
    let expensesTotal = 0;
    let wholesaleTotal = 0;
    let dayCount = 0;

    for (let i = 2; i < rows.length; i++) {
        const row = rows[i];

        if (
            !row[0] &&
            !row[1] &&
            !row[2] &&
            !row[3]
        ) {
            continue;
        }

        sellTotal += parseAmount(row[1]);
        expensesTotal += parseAmount(row[2]);
        wholesaleTotal += parseAmount(row[3]);

        dayCount++;
    }

    const cards = [
        {
            label:"مجموع البيع",
            value:sellTotal,
            className:"teal"
        },
        {
            label:"مجموع المصاريف",
            value:expensesTotal,
            className:"coral"
        },
        {
            label:"مجموع الجملة",
            value:wholesaleTotal,
            className:"amber"
        },
        {
            label:"عدد الأيام المسجلة",
            value:dayCount,
            className:"ink"
        }
    ];

    cards.forEach(cardData => {
        const element =
            document.createElement("div");

        element.className =
            "kpi-card " +
            cardData.className;

            <div class="label">
                ${cardData.label}
            </div>

            <div class="value num">
                ${formatNumberNoDecimals(cardData.value)}
            </div>
        `;

        container.appendChild(element);
    });

function renderMonthlyCards(workbook){
    const worksheet =
        workbook.Sheets["شهري"];

    const container =
        document.getElementById("monthlyCards");

    container.innerHTML = "";

    if (!worksheet) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد ورقة باسم "شهري".' +
            '</div>';

        return;
    }

    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

    if (rows.length < 2) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد بيانات شهرية.' +
            '</div>';

        return;
    }

    const headers = rows[0];
    let hasData = false;

    for (let i = 1; i < rows.length; i++) {
        const row = rows[i];

        if (
            row.every(value => {
                return value === "" ||
                       value == null;
            })
        ) {
            continue;
        }

        let hasNonZeroValue = false;

        for (let col = 1; col < row.length; col++) {
            const value = parseAmount(row[col]);

            if (value !== 0) {
                hasNonZeroValue = true;
                break;
            }
        }

        if (!hasNonZeroValue) {
            continue;
        }

        hasData = true;

        const card =
            document.createElement("div");

        card.className = "ticket-card";

        let html = "";

        for (let col = 1; col < row.length; col++) {
            if (
                row[col] === "" ||
                row[col] == null
            ) {
                continue;
            }

            const number = parseAmount(row[col]);
            const negativeClass =
                number < 0 ? "neg" : "";

            html += `
                <div class="row">
                    <span class="m-label">
                        ${escapeHtml(headers[col] || "")}
                    </span>

                    <span class="m-value num ${negativeClass}">
                        ${formatNumberNoDecimals(number)}
                    </span>
                </div>
            `;
        }

        card.innerHTML = `
            <div class="t-title">
                ${escapeHtml(row[0] || "")}
            </div>

            <div class="metric-list">
                ${html}
            </div>
        `;

        container.appendChild(card);
    }

    if (!hasData) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد بيانات شهرية.' +
            '</div>';
    }
}

function renderWeeklyCards(workbook){
    const worksheet =
        workbook.Sheets["ملخص"];

    const container =
        document.getElementById("weeklyCards");

    container.innerHTML = "";

    if (!worksheet) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد ورقة باسم "ملخص".' +
            '</div>';

        return;
    }

    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

    const weeklyMap = new Map();

    for (let i = 2; i < rows.length; i++) {
        const row = rows[i];

        if (!row[0]) {
            continue;
        }

        let date;

        if (typeof row[0] === "number") {
            date = excelSerialToDate(row[0]);
        } else if (row[0] instanceof Date) {
            date = row[0];
        } else {
            date = new Date(row[0]);
        }

        if (!(date instanceof Date) || isNaN(date.getTime())) {
            continue;
        }

        const day = date.getDay();

        const mondayOffset =
            day === 0
            ? -6
            : 1 - day;

        const monday = new Date(date);

        monday.setDate(
            date.getDate() + mondayOffset
        );

        monday.setHours(0,0,0,0);

        const key =
            monday.toISOString().slice(0,10);

        const sunday = new Date(monday);

        sunday.setDate(
            monday.getDate() + 6
        );

        if (!weeklyMap.has(key)) {
            weeklyMap.set(key, {
                from:monday,
                to:sunday,
                sell:0,
                expenses:0,
                wholesale:0
            });
        }

        const week = weeklyMap.get(key);

        week.sell += parseAmount(row[1]);
        week.expenses += parseAmount(row[2]);
        week.wholesale += parseAmount(row[3]);
    }

    const weeks =
        Array.from(weeklyMap.values())
        .filter(week => {
            return week.sell !== 0 ||
                   week.expenses !== 0 ||
                   week.wholesale !== 0;
        })
        .sort((a,b) => {
            return b.from - a.from;
        });

    if (weeks.length === 0) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد بيانات أسبوعية.' +
            '</div>';

        return;
    }

    weeks.forEach(week => {
        const card =
            document.createElement("div");

        card.className = "ticket-card";

        card.innerHTML = `
            <div class="t-title">
                أسبوع ${formatArabicDate(week.from)}
            </div>

            <div class="t-sub">
                إلى ${formatArabicDate(week.to)}
            </div>

            <div class="metric-grid">
                <div class="metric ${
                    week.sell < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">بيع</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(week.sell)}
                    </div>
                </div>

                <div class="metric ${
                    week.expenses < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">مصاريف</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(week.expenses)}
                    </div>
                </div>

                <div class="metric ${
                    week.wholesale < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">جملة</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(week.wholesale)}
                    </div>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

function renderDailyCards(workbook){
    const worksheet =
        workbook.Sheets["ملخص"];

    const container =
        document.getElementById("dailyCards");

    container.innerHTML = "";

    if (!worksheet) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد ورقة باسم "ملخص".' +
            '</div>';

        return;
    }

    const rows =
        XLSX.utils.sheet_to_json(
            worksheet,
            {
                header:1,
                defval:"",
                blankrows:false
            }
        );

    const dailyRows = [];

    for (let i = 2; i < rows.length; i++) {
        const row = rows[i];

        if (!row[0]) {
            continue;
        }

        let dateObj;
        let dateText;

        if (typeof row[0] === "number") {
            dateObj = excelSerialToDate(row[0]);
            dateText = formatArabicDate(dateObj);
        } else if (row[0] instanceof Date) {
            dateObj = row[0];
            dateText = formatArabicDate(dateObj);
        } else {
            dateObj = new Date(row[0]);

            if (isNaN(dateObj.getTime())) {
                dateObj = null;
            }

            dateText = row[0];
        }

        const sell = parseAmount(row[1]);
        const expenses = parseAmount(row[2]);
        const wholesale = parseAmount(row[3]);

        if (
            sell === 0 &&
            expenses === 0 &&
            wholesale === 0
        ) {
            continue;
        }

        dailyRows.push({
            dateObj:dateObj,
            dateText:dateText,
            sell:sell,
            expenses:expenses,
            wholesale:wholesale
        });
    }

    dailyRows.sort((a,b) => {
        const dateA = a.dateObj
            ? a.dateObj.getTime()
            : 0;

        const dateB = b.dateObj
            ? b.dateObj.getTime()
            : 0;

        return dateB - dateA;
    });

    if (dailyRows.length === 0) {
        container.innerHTML =
            '<div class="empty-note">' +
            'لا توجد بيانات يومية.' +
            '</div>';

        return;
    }

    dailyRows.forEach(row => {
        const card =
            document.createElement("div");

        card.className = "ticket-card";

        card.innerHTML = `
            <div class="t-title">
                ${escapeHtml(row.dateText)}
            </div>

            <div class="metric-grid">
                <div class="metric ${
                    row.sell < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">بيع</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(row.sell)}
                    </div>
                </div>

                <div class="metric ${
                    row.expenses < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">مصاريف</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(row.expenses)}
                    </div>
                </div>

                <div class="metric ${
                    row.wholesale < 0 ? "neg" : "pos"
                }">
                    <div class="m-label">جملة</div>
                    <div class="m-value num">
                        ${formatNumberNoDecimals(row.wholesale)}
                    </div>
                </div>
            </div>
        `;

        container.appendChild(card);
    });
}

function setupTabs(){
    if (tabsInitialized) {
        return;
    }

    tabsInitialized = true;

    const buttons =
        document.querySelectorAll(".tab-btn");

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            buttons.forEach(item => {
                item.classList.remove("active");
            });

            document.querySelectorAll(".panel")
                .forEach(panel => {
                    panel.classList.remove("active");
                });

            button.classList.add("active");

            const panel =
                document.getElementById(
                    "panel-" + button.dataset.tab
                );

            if (panel) {
                panel.classList.add("active");
            }
        });
    });
}

function getCurrentFilters(){
    return {
        date:document.getElementById("selectDate").value,
        operation:document.getElementById("selectOperation").value,
        description:document.getElementById("filterDescription").value,
        amount:document.getElementById("filterAmount").value
    };
}

function restoreSelectValue(select, value){
    const exists =
        Array.from(select.options)
        .some(option => option.value === value);

    select.value = exists ? value : "";
}

function refreshFilters(workbook){
    const selectDate =
        document.getElementById("selectDate");

    const selectOperation =
        document.getElementById("selectOperation");

    const oldFilters =
        getCurrentFilters();

    const dateSheets =
        getDateSheets(workbook);

    selectDate.innerHTML =
        '<option value="">الكل</option>';

    dateSheets.forEach(sheetName => {
        const option =
            document.createElement("option");

        option.value = sheetName;
        option.textContent =
            formatSheetDate(sheetName);

        selectDate.appendChild(option);
    });

    const operations =
        getOperationList(workbook);

    selectOperation.innerHTML =
        '<option value="">الكل</option>';

    operations.forEach(operation => {
        const option =
            document.createElement("option");

        option.value = operation;
        option.textContent = operation;

        selectOperation.appendChild(option);
    });

    restoreSelectValue(selectDate, oldFilters.date);
    restoreSelectValue(
        selectOperation,
        oldFilters.operation
    );

    document.getElementById("filterDescription")
        .value = oldFilters.description;

    document.getElementById("filterAmount")
        .value = oldFilters.amount;
}

function applyTransactionFilter(){
    if (!currentWorkbook) {
        return;
    }

    const selectedDate =
        document.getElementById("selectDate").value;

    const selectedOperation =
        document.getElementById("selectOperation").value;

    const descriptionFilter =
        document.getElementById("filterDescription")
        .value
        .trim();

    const amountFilter =
        document.getElementById("filterAmount")
        .value
        .trim();

    const dateSheets =
        getDateSheets(currentWorkbook);

    const sheetsToRead =
        selectedDate
        ? [selectedDate]
        : dateSheets;

    let allRows = [];

    sheetsToRead.forEach(sheetName => {
        const sheetRows =
            getFilteredRows(
                currentWorkbook,
                sheetName,
                selectedOperation,
                descriptionFilter,
                amountFilter
            );

        allRows = allRows.concat(sheetRows);
    });

    renderTransactionCards(allRows);
}

function setupFilters(){
    document.getElementById("btnShow")
        .onclick = applyTransactionFilter;

    document.getElementById("selectDate")
        .onchange = applyTransactionFilter;

    document.getElementById("selectOperation")
        .onchange = applyTransactionFilter;

    document.getElementById("filterDescription")
        .oninput = applyTransactionFilter;

    document.getElementById("filterAmount")
        .oninput = applyTransactionFilter;
}

async function refreshPage(){
    const button =
        document.getElementById("refreshBtn");

    const icon =
        button.querySelector(".refresh-icon");

    const text =
        button.querySelector(".refresh-text");

    button.disabled = true;
    button.classList.add("loading");

    icon.textContent = "⟳";
    text.textContent = "جاري التحديث";

    try {
        const arrayBuffer =
            await loadWorkbook();

        const workbook =
            parseWorkbookFromBuffer(arrayBuffer);

        currentWorkbook = workbook;

        renderHeroKpis(workbook);
        renderMonthlyCards(workbook);
        renderWeeklyCards(workbook);
        renderDailyCards(workbook);

        refreshFilters(workbook);
        applyTransactionFilter();

        const nowIso = new Date().toISOString();

        saveToCache(arrayBuffer, nowIso);
        updateLastUpdateDisplay(nowIso);

    } catch (error) {
        console.error(error);

        alert(
            "حدث خطأ أثناء تحميل ملف صندوق دبوس.xlsx:\n" +
            error.message
        );
    } finally {
        button.disabled = false;
        button.classList.remove("loading");

        icon.textContent = "🔄";
        text.textContent = "تحديث";
    }
}

setupTabs();
setupFilters();

document.getElementById("refreshBtn")
    .addEventListener("click", refreshPage);

function loadFromCacheOnStartup(){
    const cached = loadFromCache();

    if (!cached) {
        return false;
    }

    try {
        const workbook =
            parseWorkbookFromBuffer(cached.arrayBuffer);

        currentWorkbook = workbook;

        renderHeroKpis(workbook);
        renderMonthlyCards(workbook);
        renderWeeklyCards(workbook);
        renderDailyCards(workbook);

        refreshFilters(workbook);
        applyTransactionFilter();

        updateLastUpdateDisplay(cached.timestamp);

        return true;

    } catch (error) {
        console.error(
            "تعذر عرض النسخة المحفوظة محلياً:",
            error
        );

        return false;
    }
}

window.addEventListener("load", () => {
    /*
        إذا في نسخة محفوظة محلياً، نعرضها فوراً
        بدون انتظار تحميل الملف من الشبكة.
        التحديث الفعلي بيصير فقط لما يضغط
        المستخدم على زر "تحديث".
    */
    const shownFromCache =
        loadFromCacheOnStartup();

    if (!shownFromCache) {
        refreshPage();
    } else {
        document.getElementById("refreshBtn")
            .disabled = false;
    }
});
